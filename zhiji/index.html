<title>默契测试 · 你有多了解我</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#EAF6F3;
  --bg2:#E8F4FC;
  --card:#ffffff;
  --primary:#4BA3C7;
  --primary-dark:#3A8FB0;
  --primary-soft:#D6EEF7;
  --green:#5CB88A;
  --green-soft:#E6F6EE;
  --mint:#7BC9A6;
  --text:#2C3E50;
  --text-light:#7A8A9A;
  --border:#D0E8E2;
  --danger:#E8747A;
  --danger-soft:#FFF0F0;
  --warn:#E8A838;
  --radius:16px;
  --shadow:0 4px 16px rgba(75,163,199,.12);
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:linear-gradient(180deg,var(--bg2) 0%,var(--bg) 100%);color:var(--text);-webkit-tap-highlight-color:transparent}
#app{max-width:430px;margin:0 auto;min-height:100%;position:relative;padding-bottom:calc(28px + env(safe-area-inset-bottom))}
.view{display:none;padding:0 0 24px;animation:fadeIn .25s ease}
.view.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
header.app-header{background:linear-gradient(135deg,#4BA3C7 0%,#6BB3E0 55%,#7BC9A6 100%);color:#fff;padding:28px 20px 24px;border-radius:0 0 28px 28px;text-align:center;margin-bottom:14px;position:relative;overflow:hidden}
header.app-header::after{content:"";position:absolute;right:-20px;top:-20px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12)}
header.app-header h1{font-size:22px;font-weight:700;letter-spacing:1px;position:relative}
header.app-header p{font-size:13px;opacity:.92;margin-top:6px;position:relative}
.step-pill{display:inline-block;background:rgba(255,255,255,.22);padding:4px 12px;border-radius:20px;font-size:12px;margin-top:10px;position:relative}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin:0 14px 12px;box-shadow:var(--shadow);border:1px solid rgba(208,232,226,.8)}
.card h2{font-size:16px;margin-bottom:12px;color:var(--primary-dark);display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h2 .badge{font-size:12px;background:var(--primary-soft);color:var(--primary-dark);padding:2px 10px;border-radius:10px;font-weight:600}
label{display:block;font-size:13px;color:var(--text-light);margin-bottom:4px;margin-top:10px}
input[type=text],input[type=number],textarea,select{width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:12px;font-size:14px;background:#FAFDFC;color:var(--text);outline:none;transition:border .2s;font-family:inherit}
input:focus,textarea:focus,select:focus{border-color:var(--primary)}
textarea{resize:vertical;min-height:64px;line-height:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border:none;border-radius:14px;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .15s,transform .1s;font-family:inherit;width:100%;margin-top:8px}
.btn:active{transform:scale(.97);opacity:.9}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-primary{background:linear-gradient(135deg,var(--primary),#5BB8D4);color:#fff;box-shadow:0 4px 12px rgba(75,163,199,.28)}
.btn-secondary{background:#fff;color:var(--primary-dark);border:1.5px solid var(--primary)}
.btn-mint{background:linear-gradient(135deg,var(--mint),var(--green));color:#fff}
.btn-danger{background:var(--danger-soft);color:var(--danger);border:1px solid #F5D0D0;font-size:13px;padding:7px 12px;width:auto;margin:0}
.btn-ghost{background:transparent;color:var(--text-light);font-size:13px;padding:8px;width:auto;margin:0}
.btn-sm{padding:9px 12px;font-size:13px;width:auto;margin:0;border-radius:12px}
.btn-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn-row .btn{flex:1;margin-top:0;min-width:0}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{padding:8px 14px;border-radius:20px;border:1.5px solid var(--border);background:#fff;font-size:13px;color:var(--text);cursor:pointer;font-family:inherit}
.chip.active{border-color:var(--primary);background:var(--primary-soft);color:var(--primary-dark);font-weight:600}
.progress-dots{display:flex;gap:5px;justify-content:center;margin:4px 0 12px;padding:0 16px}
.progress-dots span{width:8px;height:8px;border-radius:50%;background:#C5DDE8;transition:all .2s}
.progress-dots span.done{background:var(--green)}
.progress-dots span.cur{background:var(--primary);width:18px;border-radius:6px}
.quiz-progress{height:5px;background:rgba(208,232,226,.9);border-radius:3px;margin:0 14px 14px;overflow:hidden}
.quiz-progress-bar{height:100%;background:linear-gradient(90deg,var(--primary),var(--mint));border-radius:3px;transition:width .3s}
.quiz-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--text-light);margin:0 16px 10px}
.quiz-q{font-size:18px;font-weight:650;line-height:1.55;margin-bottom:18px}
.opt-btn{display:flex;align-items:center;width:100%;text-align:left;padding:13px 14px;margin-bottom:10px;border:1.5px solid var(--border);border-radius:14px;background:#fff;font-size:15px;color:var(--text);cursor:pointer;transition:all .15s;font-family:inherit;line-height:1.4}
.opt-btn:active{transform:scale(.98)}
.opt-btn.selected{border-color:var(--primary);background:#F0F9FC;color:var(--primary-dark)}
.opt-btn.correct-mark{border-color:var(--green);background:var(--green-soft)}
.opt-letter{display:inline-flex;width:26px;height:26px;align-items:center;justify-content:center;border-radius:50%;background:var(--bg2);color:var(--primary);font-weight:700;font-size:13px;margin-right:10px;flex-shrink:0}
.opt-btn.selected .opt-letter{background:var(--primary);color:#fff}
.opt-btn.correct-mark .opt-letter{background:var(--green);color:#fff}
.opt-edit{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.opt-edit input[type=radio]{accent-color:var(--primary);width:18px;height:18px;flex-shrink:0}
.opt-edit input[type=text]{flex:1}
.opt-edit .rm{flex-shrink:0;width:32px;height:32px;border-radius:10px;border:1px solid #F5D0D0;background:var(--danger-soft);color:var(--danger);font-size:16px;cursor:pointer}
.result-card{text-align:center;padding:26px 18px}
.result-card .score-num{font-size:52px;font-weight:750;color:var(--primary);line-height:1}
.result-card .score-label{font-size:14px;color:var(--text-light);margin:6px 0 16px}
.result-card .comment{font-size:15px;line-height:1.65;margin-bottom:14px;padding:14px;background:linear-gradient(135deg,#F0F9FC,#EAF7F1);border-radius:14px}
.result-card .reward{font-size:15px;color:var(--primary-dark);font-weight:650;padding:14px 16px;border:1.5px dashed var(--primary);border-radius:14px;margin-bottom:8px;background:#FBFEFF}
.result-card .no-reward{font-size:14px;color:var(--text-light);padding:12px;background:#F7F8FA;border-radius:12px;margin-bottom:8px}
.reward-preview{display:flex;align-items:center;gap:12px;padding:12px;background:linear-gradient(135deg,#F0F9FC,#EAF7F1);border-radius:14px;margin-top:8px}
.reward-preview .emoji{font-size:28px}
.reward-preview .txt{flex:1;text-align:left}
.reward-preview .txt b{display:block;font-size:15px;color:var(--primary-dark)}
.reward-preview .txt span{font-size:12px;color:var(--text-light)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.stat-box{background:var(--bg2);border-radius:12px;padding:14px 10px;text-align:center}
.stat-box .n{font-size:24px;font-weight:700;color:var(--primary-dark)}
.stat-box .l{font-size:12px;color:var(--text-light);margin-top:2px}
.hint{font-size:12px;color:var(--text-light);line-height:1.55;margin-top:8px}
.band-row{display:flex;gap:8px;align-items:flex-start;margin-bottom:10px}
.band-row .band-range{flex:0 0 78px;font-size:12px;color:var(--primary);font-weight:600;padding-top:12px;text-align:center}
.band-row textarea{flex:1;min-height:52px}
.modal-mask{position:fixed;inset:0;background:rgba(30,50,60,.45);z-index:100;display:flex;align-items:flex-end;justify-content:center;max-width:430px;margin:0 auto}
.modal{background:#fff;border-radius:22px 22px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));width:100%;max-height:88vh;overflow-y:auto}
.modal h3{font-size:17px;margin-bottom:12px;text-align:center}
.bank-list{max-height:46vh;overflow-y:auto}
.bank-item{padding:12px;border:1px solid var(--border);border-radius:12px;margin-bottom:8px;cursor:pointer;background:#FAFDFC}
.bank-item:active{background:var(--primary-soft)}
.bank-item.used{opacity:.45;cursor:not-allowed;background:#F3F5F7}
.bank-item .bq{font-size:14px;font-weight:550;margin-bottom:4px}
.bank-item .bo{font-size:12px;color:var(--text-light);line-height:1.5}
.bank-item .tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:8px;background:var(--green-soft);color:var(--green);margin-bottom:4px;font-weight:600}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:rgba(44,62,80,.9);color:#fff;padding:10px 18px;border-radius:22px;font-size:13px;z-index:200;max-width:82%;text-align:center;pointer-events:none;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}
.footer-note{text-align:center;padding:8px 20px;font-size:12px;color:var(--text-light);line-height:1.5}
.hero-emoji{font-size:42px;margin-bottom:8px}
.intro-title{font-size:20px;font-weight:700;line-height:1.4;margin-bottom:8px;color:var(--text)}
.slot-tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 8px;border-radius:8px;background:var(--green-soft);color:var(--green);font-weight:600}
.slot-tag.empty{background:#F3F5F7;color:var(--text-light)}
.leaderboard{margin-top:10px}
.lb-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}
.lb-row:last-child{border-bottom:none}
.lb-score{color:var(--primary-dark);font-weight:650}
.search-box{margin-bottom:10px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.toolbar .btn{flex:1 1 calc(50% - 8px);min-width:100px}
.num-row{display:flex;gap:10px;align-items:center}
.num-row input{flex:1}
.q-preview{font-size:15px;font-weight:600;line-height:1.5;margin-bottom:12px;padding:12px;background:var(--bg2);border-radius:12px}
.cat-tabs{display:flex;flex-wrap:nowrap;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 0 10px;margin-bottom:4px}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-tab{flex:0 0 auto;padding:7px 12px;border-radius:16px;border:1.5px solid var(--border);background:#fff;font-size:12px;color:var(--text);cursor:pointer;font-family:inherit;white-space:nowrap}
.cat-tab.active{border-color:var(--primary);background:var(--primary-soft);color:var(--primary-dark);font-weight:650}
.tip-box{background:#FFF8E8;border:1px solid #F0D9A0;border-radius:12px;padding:12px;font-size:13px;line-height:1.55;color:#7A5A20;margin-top:10px}
.tip-box b{display:block;margin-bottom:4px}
.action-bar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.action-bar .btn{margin-top:0}
.action-bar .span2{grid-column:1 / -1}
</style>
</head>

  bytes.forEach(b=>bin+=String.fromCharCode(b));
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function fromBase64Url(s){
  s=s.replace(/-/g,'+').replace(/_/g,'/');
  while(s.length%4)s+='=';
  const bin=atob(s);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function encodeQuiz(quiz){
  const compact={
    i:quiz.id,
    n:quiz.name||'',
    t:quiz.title||'',
    r:quiz.reward||'',
    th:quiz.threshold|0,
    inv:quiz.inventory==null?null:quiz.inventory,
    b:(quiz.bands||[]).map(x=>({m:x.min,x:x.max,t:x.text})),
    q:(quiz.questions||[]).map(x=>({q:x.q,o:x.options,a:x.answer}))
  };
  return toBase64Url(JSON.stringify(compact));
}
function decodeQuiz(payload){
  try{
    const c=JSON.parse(fromBase64Url(payload));
    if(!c||!Array.isArray(c.q)||c.q.length!==Q_COUNT)return null;
    return {
      id:c.i||uid(),
      name:c.n||'',
      title:c.t||((c.n||'神秘人')+'的默契测试卷'),
      reward:c.r||'神秘奖励',
      threshold:typeof c.th==='number'?c.th:9,
      inventory:c.inv==null?null:c.inv,
      bands:(c.b||[]).map(x=>({min:x.m,max:x.x,text:x.t})),
      questions:c.q.map(x=>({q:x.q,options:x.o,answer:x.a}))
    };
  }catch(e){return null}
}

function emptySlots(){
  return Array.from({length:Q_COUNT},()=>({q:'',options:['','',''],answer:0,filled:false}));

/* ---------- Payload extraction (q first!) ---------- */
function extractPayload(){
  const params=new URLSearchParams(location.search);
  let qPayload=params.get('q');
  const hash=location.hash||'';
  // #play/PAYLOAD or #play/PAYLOAD?...
  if(!qPayload){
    const hm=hash.match(/^#play\/([^?&#]+)/i);
    if(hm) qPayload=decodeURIComponent(hm[1]);
  }
  // #q=PAYLOAD
  if(!qPayload && /^#q=/i.test(hash)) qPayload=hash.slice(3);
  // hash query ?q=
  if(!qPayload){
    const m=hash.match(/[?&]q=([^&]+)/);
    if(m)qPayload=decodeURIComponent(m[1]);
  }
  return qPayload;
}

function pathBase(){
  // Prefer directory form .../zhiji/ for share links
  let p=location.pathname;
  if(p.endsWith('play.html')) p=p.replace(/play\.html$/,'');
  if(p.endsWith('index.html')) p=p.replace(/index\.html$/,'');
  if(!p.endsWith('/')) p=p.replace(/\/[^/]*$/,'/') || '/';
  return location.origin + p;
}

/* ---------- Routing: q ALWAYS forces play ---------- */
function parseRoute(){
  const params=new URLSearchParams(location.search);
  const qPayload=extractPayload();
  const hash=location.hash||'';
  const raw=(hash.replace(/^#/,'').split('?')[0]||'');
  const h=raw.toLowerCase().split('/')[0];

  // Manage ONLY when explicitly requested and not sharing as friend
  // If ?q= present → NEVER create/home for friends
  if(qPayload){
    // Creator can open manage with ?manage=1 even if somehow q present — but share links never include manage
    if(params.get('manage')==='1' && h==='manage'){
      return 'manage';
    }
    const quiz=decodeQuiz(qPayload);
    if(quiz){
      if(!S.playQuiz || S.playQuiz.id!==quiz.id){
        S.playQuiz=quiz;
        S.playIdx=0;S.playAnswers=[];S.result=null;
      } else {
        S.playQuiz=quiz;
      }
      // Force play hash for WeChat / share
      if(h!=='play' && h!=='result'){
        try{ history.replaceState(null,'', location.pathname + location.search + '#play'); }catch(e){}
      }
      if(h==='result' && S.result) return 'result';
      if(h==='play' && S.playAnswers && S.playAnswers.length>0 && S.playIdx>0 && !S.result) return 'play';
      return 'play-intro';
    }
    // bad payload — fall through but still not create
    return 'play-intro';
  }

  if(params.get('manage')==='1') return 'manage';
  if(['home','create','reward','manage'].includes(h)) return h;
  if(h==='result' && S.result && S.playQuiz) return 'result';
  if(h==='play') return S.playQuiz ? (S.playAnswers.length>0 && S.playIdx>0 && !S.result ? 'play' : 'play-intro') : 'home';
  return 'home';
}

function navigate(route, replace){
  // Friend play with q: never navigate to create/home/reward
  if(extractPayload() && ['home','create','reward'].includes(route)){
    route='play-intro';
  }
  S.route=route;
  const map={home:'#home',create:'#create',reward:'#reward',manage:'#manage','play-intro':'#play',play:'#play',result:'#result'};
  let target=map[route]||'#home';
  // keep search when playing
  const q=extractPayload();
  if(q && (route==='play-intro'||route==='play'||route==='result')){
    const path=location.pathname;
    const search=location.search || ('?q='+encodeURIComponent(q));
    const url=path+search+target;
    if(replace) history.replaceState(null,'',url);
    else if(location.hash!==target){ location.hash=target; }
    else render();
    if(location.hash===target || replace) render();
    return;
  }
  if(replace) history.replaceState(null,'', location.pathname + (route==='manage'?'?manage=1':'') + target);
  else if(location.hash!==target) location.hash=target;
  else render();
  if(location.hash===target) render();
}

function onHash(){
  const r=parseRoute();
  S.route=r;
  if(r==='create'||r==='reward'){ if(!S.draft) loadDraft(); ensureSlotSeeded(); }
  if(r==='manage') loadPublished();
  render();
}

/* ---------- Bank helpers (no duplicates across slots) ---------- */
function getUsedBankSet(exceptSlot){
  const used=new Set();
  if(!S.draft||!S.draft.slots) return used;
  S.draft.slots.forEach((s,i)=>{
    if(exceptSlot!=null && i===exceptSlot) return;
    if(s && typeof s.bankIdx==='number' && s.bankIdx>=0) used.add(s.bankIdx);
  });
  return used;
}
function pickRandomUnused(exceptSlot){
  const used=getUsedBankSet(exceptSlot!=null?exceptSlot:S.draft.step);
  const pool=BANK.map((_,i)=>i).filter(i=>!used.has(i));
  if(!pool.length){ toast('题库已用完，请自定义或从已选题中换掉'); return null; }
  return pool[Math.floor(Math.random()*pool.length)];
}
function applyBankToSlot(slotIdx, bankIdx, keepAnswer){
  const used=getUsedBankSet(slotIdx);
  if(used.has(bankIdx)){ toast('这道题已在其他题槽使用'); return false; }
  const b=BANK[bankIdx];
  const prev=S.draft.slots[slotIdx];
  const ans=(keepAnswer && prev && prev.answer!=null)?clamp(prev.answer|0,0,b.options.length-1):0;
  S.draft.slots[slotIdx]={q:b.q,options:[...b.options],answer:ans,filled:true,bankIdx};
  saveDraft();
  return true;
}
function ensureSlotSeeded(){
  if(!S.draft) return;
  const i=clamp(S.draft.step|0,0,Q_COUNT-1);
  const slot=S.draft.slots[i];
  if(!slot || slot.filled) return;
  const idx=pickRandomUnused(i);
  if(idx!=null) applyBankToSlot(i, idx);
}

/* ---------- Render ---------- */
function render(){
  const app=document.getElementById('app');
  let r=S.route;
  // Guard: never show create UI when friend payload present
  if(extractPayload() && (r==='home'||r==='create'||r==='reward'||r==='manage' && !(new URLSearchParams(location.search).get('manage')==='1'))){
    if(r!=='result' || !S.result) r=S.route=(S.result?'result':'play-intro');
  }
  if(r==='create' && S.draft && (S.draft.step|0)>=Q_COUNT) r='reward';
  if(r==='create') ensureSlotSeeded();
  if(r==='home') app.innerHTML=viewHome();
  else if(r==='create') app.innerHTML=viewCreate();
  else if(r==='reward') app.innerHTML=viewReward();
  else if(r==='manage') app.innerHTML=viewManage();
  else if(r==='play-intro') app.innerHTML=viewPlayIntro();
  else if(r==='play') app.innerHTML=viewPlay();
  else if(r==='result') app.innerHTML=viewResult();
  else app.innerHTML=viewHome();
  window.scrollTo(0,0);
}

function saveEditor(){
  const q=String(S._edit.q||'').trim();
  const options=S._edit.options.map(o=>String(o||'').trim());
  if(!q){toast('请填写题目');return;}
  if(options.some(o=>!o)){toast('请填完所有选项');return;}
  if(options.length<2||options.length>6){toast('选项需 2–6 个');return;}
  const ans=clamp(S._edit.answer|0,0,options.length-1);
  // Custom questions do NOT keep bankIdx — frees previous bank id
  const slot={q,options,answer:ans,filled:true};
  if(!S._editIsNew && typeof S._edit.bankIdx==='number' && !S._editIsNew){
    // editing existing bank question text → treat as custom (no bank id) if user opened custom, else keep if same bank content edit
  }

  if(S._editIsNew){
    // custom — no bankIdx
  } else if(typeof S.draft.slots[S.draft.step].bankIdx==='number' && q===S.draft.slots[S.draft.step].q){
    slot.bankIdx=S.draft.slots[S.draft.step].bankIdx;

  // if question text changed from bank, drop bankIdx
  S.draft.slots[S.draft.step]=slot;
  saveDraft();closeModal();toast('已保存');render();
}

      <input type="text" maxlength="12" placeholder="例如：小明（可不填）" value="${escapeHtml(d.name||'')}" oninput="S.draft.name=this.value;S.draft.nameSkipped=false;saveDraft()">
      <div class="chip-row">
        <button type="button" class="chip ${d.nameSkipped||!(d.name||'').trim()?'active':''}" onclick="skipName()">跳过 / 不填</button>
      </div>
      <p class="hint">不填则显示「神秘人的默契测试卷」</p>
    </div>
    <div class="card">
      <h2>奖励内容</h2>
      <div class="chip-row">
        ${REWARD_PRESETS.map(p=>`<button type="button" class="chip ${d.reward===p?'active':''}" onclick="pickReward('${p}')">${p}</button>`).join('')}
        <button type="button" class="chip ${isCustom?'active':''}" onclick="pickRewardCustom()">自定义</button>
      </div>
      ${isCustom?`<label style="margin-top:12px">自定义奖励</label>
      <input type="text" id="reward-input" value="${escapeHtml(rewardVal||'')}" oninput="onRewardInput(this.value)" placeholder="写上你的奖励…">`:''}
    </div>
    <div class="card">
      <h2>获奖门槛</h2>
      <p class="hint" style="margin-top:0">答对几题可获奖？</p>
      <div class="chip-row">
        ${THRESH_PRESETS.map(n=>`<button type="button" class="chip ${(d.threshold|0)===n?'active':''}" onclick="pickThreshold(${n})">${n} 题</button>`).join('')}
      </div>
    </div>
    <div class="card">
      <h2>奖品份数</h2>
      <div class="chip-row">
        ${INV_PRESETS.map(p=>`<button type="button" class="chip ${(inv===p.value || (inv==null&&p.value==null))?'active':''}" onclick="pickInventory(${p.value===null?'null':p.value})">${p.label}</button>`).join('')}
      </div>
      <p class="hint">仅作文案展示；真实兑换请出题人自行核对。</p>
    </div>
    <div class="card">
      <h2>分段评语 <span class="badge">已预填可改</span></h2>
      <p class="hint">按答对题数展示评语，可直接用默认文案。</p>
      <div id="band-list">${renderBandsEditor()}</div>
      <button class="btn btn-secondary btn-sm" onclick="addBand()">＋ 增加一档</button>
    </div>
    <div class="card">
      <button class="btn btn-primary" onclick="publishQuiz()">生成并发布测试卷</button>
      <button class="btn btn-secondary" onclick="S.draft.step=Q_COUNT-1;saveDraft();navigate('create')">返回改题</button>
    </div>
  </div>`;
}
function renderBandsEditor(){
  return (S.draft.bands||[]).map((b,i)=>`
    <div class="band-row" style="flex-wrap:wrap">
      <div style="display:flex;gap:4px;align-items:center;width:100%;margin-bottom:4px">
        <input type="number" style="width:64px" min="0" max="10" value="${b.min}" onchange="updBand(${i},'min',this.value)">
        <span class="hint">至</span>
        <input type="number" style="width:64px" min="0" max="10" value="${b.max}" onchange="updBand(${i},'max',this.value)">
        <span class="hint">题</span>
        ${S.draft.bands.length>4?`<button class="btn btn-danger" onclick="rmBand(${i})">删</button>`:''}
      </div>
      <textarea style="width:100%" rows="2" oninput="updBand(${i},'text',this.value)">${escapeHtml(b.text)}</textarea>
    </div>`).join('');
}
function skipName(){S.draft.name='';S.draft.nameSkipped=true;saveDraft();render()}
function pickReward(p){S.draft.reward=p;S.draft.rewardCustom='';saveDraft();render()}
function pickRewardCustom(){S.draft.reward=S.draft.rewardCustom||'';S.draft.rewardCustom=S.draft.rewardCustom||'';saveDraft();render();setTimeout(()=>{const el=document.getElementById('reward-input');if(el)el.focus()},50)}
function onRewardInput(v){S.draft.reward=v;S.draft.rewardCustom=v;saveDraft()}
function pickThreshold(n){S.draft.threshold=n;saveDraft();render()}
function pickInventory(v){S.draft.inventory=v;saveDraft();render()}
function updBand(i,k,v){ if(k==='text')S.draft.bands[i].text=v; else S.draft.bands[i][k]=clamp(+v||0,0,10); saveDraft(); }
function addBand(){S.draft.bands.push({min:0,max:0,text:''});saveDraft();render()}
function rmBand(i){if(S.draft.bands.length<=4){toast('至少保留 4 档');return;}S.draft.bands.splice(i,1);saveDraft();render()}

function publishQuiz(){
  const d=S.draft;
  if(d.slots.some(s=>!s.filled)){toast('还有题目未完成');navigate('create');return;}
  const name=(d.name||'').trim()||'神秘人';
  let reward=(d.reward||'').trim();
  if(!reward){toast('请选择或填写奖励');return;}
  if(!d.bands||d.bands.length<4){toast('请至少设置 4 档评语');return;}
  const quiz={
    id:d.id||uid(),
    name,
    title:name+'的默契测试卷',
    reward,
    threshold:clamp(d.threshold|0,1,10),
    inventory:d.inventory==null||d.inventory===''?null:Math.max(0,+d.inventory||0),
    bands:d.bands.map(b=>({min:+b.min||0,max:+b.max||0,text:String(b.text||'')})),
    questions:d.slots.map(s=>({q:s.q,options:[...s.options],answer:s.answer|0}))
  };
  savePublished(quiz);
  const st=getStats(quiz.id); setStats(quiz.id,st);
  // Creator manage page: NO ?q= so share URL is distinct; friends use ?q=
  history.replaceState(null,'', location.pathname + '?manage=1#manage');
  S.route='manage';
  toast('已生成！请复制邀请链接发给好友');
  render();
}

function shareUrl(quiz){
  const payload=encodeQuiz(quiz);
  // Dedicated short path: .../zhiji/?q=PAYLOAD  (no #create / #home)
  return pathBase() + '?q=' + payload;
}
function shareUrlHashFallback(quiz){
  const payload=encodeQuiz(quiz);
  return pathBase() + '#play/' + payload;
}

function viewManage(){
  loadPublished();
  const quiz=S.published;
  if(!quiz){
    return `<div class="view active"><header class="app-header"><h1>默契测试</h1></header>
      <div class="card"><p class="hint">还没有已发布的试卷</p>
      <button class="btn btn-primary" onclick="startCreate(false)">去出题</button></div></div>`;
  }
  const st=getStats(quiz.id);
  const invTxt=quiz.inventory==null?'不限量':(quiz.inventory+' 份');
  return `
  <div class="view active">
    <header class="app-header">
      <h1>${escapeHtml(quiz.title)}</h1>
      <p>出题人主页</p>
    </header>
    <div class="card">
      <div class="reward-preview">
        <div class="emoji">🎁</div>
        <div class="txt">
          <b>${escapeHtml(quiz.reward)}</b>
          <span>答对 ≥ ${quiz.threshold} 题可获奖 · 库存 ${invTxt}</span>
        </div>
      </div>
      <div class="tip-box">
        <b>微信分享提示</b>
        发给微信好友请复制下方链接；打开后应直接进入答题介绍页（不会看到出题界面）。若微信去掉了链接参数，可改用「生成纯答题页」备用链接。
      </div>
    </div>
    <div class="card">
      <h2>数据统计</h2>
      <div class="stat-grid">
        <div class="stat-box"><div class="n">${st.plays|0}</div><div class="l">答题人数</div></div>
        <div class="stat-box"><div class="n">${st.wins|0}</div><div class="l">获奖人数</div></div>
      </div>
      <p class="hint">统计仅保存在本机浏览器，换设备/清缓存会丢失；好友端各自本地记录，不会自动汇总到你这里。</p>
    </div>
    ${(st.board&&st.board.length)?`
    <div class="card"><h2>本机排行榜</h2><div class="leaderboard">
      ${st.board.slice(0,20).map(r=>`<div class="lb-row"><span>${escapeHtml(r.nick||'匿名')}</span><span class="lb-score">${r.score}/${Q_COUNT}</span></div>`).join('')}
    </div></div>`:''}
    <div class="card">
      <button class="btn btn-primary" onclick="copyLink()">复制邀请链接</button>
      <button class="btn btn-secondary" onclick="copyHashLink()">生成纯答题页（备用）</button>
      <button class="btn btn-secondary" onclick="showQuestions()">查看题目</button>
      <button class="btn btn-mint" onclick="previewAsFriend()">试玩答题</button>
      <button class="btn btn-ghost" style="width:100%" onclick="clearManageAndHome()">返回出题（新建）</button>
      <p class="hint">主链接格式：…/zhiji/?q=…　备用：…/zhiji/#play/…</p>
    </div>
    <div id="q-view"></div>
  </div>`;
}
function clearManageAndHome(){
  history.replaceState(null,'', location.pathname + '#home');
  startCreate(false);
}
function showQuestions(){
  const quiz=S.published; if(!quiz)return;
  const box=document.getElementById('q-view');
  if(box.dataset.open==='1'){box.innerHTML='';box.dataset.open='';return;}
  box.dataset.open='1';
  box.innerHTML=`<div class="card"><h2>题目一览</h2>${quiz.questions.map((q,i)=>`
    <div style="margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border)">
      <div style="font-weight:600;margin-bottom:6px">${i+1}. ${escapeHtml(q.q)}</div>
      ${q.options.map((o,j)=>`<div style="font-size:13px;color:${j===q.answer?'var(--green)':'var(--text-light)'};padding:2px 0">${LETTERS[j]}. ${escapeHtml(o)}${j===q.answer?' ✓':''}</div>`).join('')}
    </div>`).join('')}</div>`;
}
async function copyLink(){
  const url=shareUrl(S.published);
  try{ await navigator.clipboard.writeText(url); toast('邀请链接已复制（打开即答题）'); }
  catch(e){ prompt('复制下面的链接发给好友（打开即答题）：', url); }
}
async function copyHashLink(){
  const url=shareUrlHashFallback(S.published);
  try{ await navigator.clipboard.writeText(url); toast('纯答题页链接已复制（#play/ 备用）'); }
  catch(e){ prompt('备用纯答题页链接：', url); }
}
function previewAsFriend(){
  // Simulate friend: use hash fallback without polluting manage
  S.playQuiz=S.published;
  S.playIdx=0;S.playAnswers=[];S.result=null;S.playNick='';
  S.route='play-intro';
  render();
}

/* ---------- Friend play ---------- */
function viewPlayIntro(){
  const quiz=S.playQuiz;
  if(!quiz){return `<div class="view active"><div class="card"><p>无效的测试链接</p><p class="hint">请让出题人重新复制邀请链接。</p></div></div>`;}
  const inv=quiz.inventory==null?'数量有限哦':('剩余展示 '+quiz.inventory+' 份');
  return `
  <div class="view active">
    <header class="app-header">
      <h1>${escapeHtml(quiz.title||'默契测试')}</h1>
      <p>好友挑战</p>
    </header>
    <div class="card" style="text-align:center;padding:26px 16px">
      <div class="hero-emoji">🎯</div>
      <div class="intro-title">关于我的 10 道题<br>你能答对多少？</div>
      <p class="hint" style="margin:10px 0 14px">答对 ≥ ${quiz.threshold} 题才有机会拿走奖励</p>
      <div class="reward-preview" style="text-align:left">
        <div class="emoji">🎁</div>
        <div class="txt"><b>${escapeHtml(quiz.reward)}</b><span>${escapeHtml(inv)} · 先到先得（展示）</span></div>
      </div>
      <label style="text-align:left;margin-top:16px">你的昵称（可选，用于本机排行）</label>
      <input type="text" maxlength="12" placeholder="怎么称呼你" value="${escapeHtml(S.playNick)}" oninput="S.playNick=this.value">
      <button class="btn btn-primary" style="margin-top:16px" onclick="beginPlay()">开始挑战</button>
    </div>
  </div>`;
}
function beginPlay(){
  S.playIdx=0;S.playAnswers=[];S.result=null;S.route='play';render();
}
function viewPlay(){
  const quiz=S.playQuiz; if(!quiz)return viewPlayIntro();
  const i=S.playIdx; const q=quiz.questions[i];
  const pct=Math.round((i/Q_COUNT)*100);
  return `
  <div class="view active">
    <header class="app-header">
      <h1>默契挑战</h1>
      <p>${escapeHtml(quiz.name||'出题人')} 的 10 道题</p>
    </header>
    <div class="quiz-progress"><div class="quiz-progress-bar" style="width:${pct}%"></div></div>
    <div class="quiz-meta"><span>第 ${i+1} / ${Q_COUNT} 题</span><span>猜 TA 的选择</span></div>
    <div class="card">
      <div class="quiz-q">${escapeHtml(q.q)}</div>
      ${q.options.map((o,j)=>`
        <button class="opt-btn" onclick="pickPlay(${j})"><span class="opt-letter">${LETTERS[j]}</span>${escapeHtml(o)}</button>
      `).join('')}
    </div>
  </div>`;
}
function pickPlay(j){
  S.playAnswers[S.playIdx]=j;
  if(S.playIdx>=Q_COUNT-1){ finishPlay(); }
  else { S.playIdx++; render(); }
}
function bandFor(score,bands){
  const list=bands&&bands.length?bands:DEFAULT_BANDS;
  let best=list[0];
  for(const b of list){
    if(score>=b.min && score<=b.max) best=b;
  }
  if(!(score>=best.min&&score<=best.max)){
    const sorted=[...list].sort((a,b)=>a.min-b.min);
    best=sorted[0];
    for(const b of sorted){ if(score>=b.min) best=b; }
  }
  return best;
}
function finishPlay(){
  const quiz=S.playQuiz;
  let score=0;
  for(let i=0;i<Q_COUNT;i++) if(S.playAnswers[i]===quiz.questions[i].answer) score++;
  const pct=Math.round(score/Q_COUNT*100);
  const band=bandFor(score, quiz.bands);
  const won=score>=(quiz.threshold|0);
  S.result={score,pct,band,won};
  const st=getStats(quiz.id);
  st.plays=(st.plays|0)+1;
  if(won) st.wins=(st.wins|0)+1;
  st.board=st.board||[];
  st.board.push({nick:S.playNick||'匿名',score,pct,at:Date.now(),won});
  st.board.sort((a,b)=>b.score-a.score||b.at-a.at);
  st.board=st.board.slice(0,50);
  setStats(quiz.id,st);
  S.route='result';
  const search=location.search||'';
  history.replaceState(null,'', location.pathname+search+'#result');
  render();
}
function viewResult(){
  const quiz=S.playQuiz; const r=S.result;
  if(!quiz||!r){S.route='play-intro';render();return''}
  return `
  <div class="view active">
    <header class="app-header">
      <h1>挑战结果</h1>
      <p>${escapeHtml(quiz.title)}</p>
    </header>
    <div class="card result-card">
      <div class="score-num">${r.pct}<span style="font-size:22px">%</span></div>
      <div class="score-label">答对 ${r.score} / ${Q_COUNT} 题</div>
      <div class="comment">${escapeHtml(r.band&&r.band.text||'')}</div>
      ${r.won
        ? `<div class="reward">🎁 恭喜获得：${escapeHtml(quiz.reward)}<br><span style="font-weight:500;font-size:12px;color:var(--text-light)">请联系出题人兑换（先到先得）</span></div>`
        : `<div class="no-reward">未获得奖励<br><span style="font-size:12px">需答对 ≥ ${quiz.threshold} 题（你答对 ${r.score} 题）</span></div>`}
      <button class="btn btn-primary" onclick="beginPlay()">再试一次</button>
      <button class="btn btn-secondary" onclick="S.route='play-intro';render()">返回介绍</button>
    </div>
  </div>`;
}

/* ---------- Init: detect q BEFORE any create routing ---------- */
(function boot(){
  const qPayload=extractPayload();
  if(qPayload){
    const quiz=decodeQuiz(qPayload);
    if(quiz){
      S.playQuiz=quiz;
      S.playIdx=0;S.playAnswers=[];S.result=null;
      // Force #play immediately, ignore stale #create/#home
      try{ history.replaceState(null,'', location.pathname + location.search + '#play'); }catch(e){}
      S.route='play-intro';
    } else {
      S.route='play-intro';
    }
  } else {
    loadDraft();
    loadPublished();
    S.route=parseRoute();
  }
  window.addEventListener('hashchange', onHash);
  Object.assign(window,{
    S,clamp,navigate,startCreate,goManage,setSlotAnswer,prevStep,nextStep,
    randomBankSlot,openBankPicker,refreshBankModal,chooseBank,closeModal,
    customSlot,editCurrentSlot,addOpt,removeOpt,saveEditor,pickReward,pickRewardCustom,
    onRewardInput,updBand,addBand,rmBand,publishQuiz,showQuestions,copyLink,copyHashLink,
    previewAsFriend,beginPlay,pickPlay,skipName,pickThreshold,pickInventory,clearManageAndHome
  });
  if((S.route==='create'||S.route==='reward')&&!S.draft) loadDraft();
  if(S.route==='create') ensureSlotSeeded();
  render();
})();
</script>
</body>
</html>
