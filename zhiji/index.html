<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>知己测试 · 你有多了解我</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#E8F4FC;
  --card:#fff;
  --primary:#4A9FD8;
  --primary-dark:#3A8BC4;
  --accent:#6BB3E0;
  --text:#2C3E50;
  --text-light:#7A8A9A;
  --border:#D0E6F5;
  --danger:#E8747A;
  --success:#5CB88A;
  --radius:14px;
  --shadow:0 2px 12px rgba(74,159,216,.1);
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent}
#app{max-width:430px;margin:0 auto;min-height:100%;padding:0 0 40px;position:relative}
.view{display:none;padding:16px}
.view.active{display:block}
header.app-header{background:linear-gradient(135deg,#4A9FD8,#6BB3E0);color:#fff;padding:28px 20px 22px;border-radius:0 0 24px 24px;text-align:center;margin-bottom:16px}
header.app-header h1{font-size:22px;font-weight:700;letter-spacing:1px}
header.app-header p{font-size:13px;opacity:.9;margin-top:6px}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card h2{font-size:16px;margin-bottom:12px;color:var(--primary-dark);display:flex;align-items:center;justify-content:space-between}
.card h2 .badge{font-size:12px;background:var(--bg);color:var(--primary);padding:2px 8px;border-radius:10px;font-weight:500}
label{display:block;font-size:13px;color:var(--text-light);margin-bottom:4px;margin-top:10px}
input[type=text],textarea,select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px;background:#FAFCFF;color:var(--text);outline:none;transition:border .2s;font-family:inherit}
input[type=text]:focus,textarea:focus,select:focus{border-color:var(--primary)}
textarea{resize:vertical;min-height:60px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .15s,transform .1s;font-family:inherit;width:100%;margin-top:8px}
.btn:active{transform:scale(.97);opacity:.9}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-secondary{background:#fff;color:var(--primary);border:1.5px solid var(--primary)}
.btn-danger{background:#FFF0F0;color:var(--danger);border:1px solid #F5D0D0;font-size:13px;padding:6px 12px;width:auto;margin:0}
.btn-ghost{background:transparent;color:var(--text-light);font-size:13px;padding:8px;width:auto;margin:0}
.btn-sm{padding:8px 14px;font-size:13px;width:auto;margin:0}
.btn-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn-row .btn{flex:1;margin-top:0;min-width:0}
.q-item{border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;background:#FAFCFF}
.q-item .q-text{font-size:14px;font-weight:500;margin-bottom:8px;line-height:1.5}
.q-item .q-opts{font-size:12px;color:var(--text-light);line-height:1.6}
.q-item .q-opts .correct{color:var(--success);font-weight:600}
.q-item .q-actions{display:flex;gap:8px;margin-top:8px;justify-content:flex-end}
.empty-hint{text-align:center;padding:30px 16px;color:var(--text-light);font-size:14px}
.empty-hint .emoji{font-size:36px;margin-bottom:10px}
.band-row{display:flex;gap:8px;align-items:flex-start;margin-bottom:10px}
.band-row .band-range{flex:0 0 70px;font-size:12px;color:var(--primary);font-weight:600;padding-top:12px;text-align:center}
.band-row textarea{flex:1;min-height:48px}
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:flex-end;justify-content:center;max-width:430px;margin:0 auto}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:20px 16px 30px;width:100%;max-height:90vh;overflow-y:auto}
.modal h3{font-size:17px;margin-bottom:12px;text-align:center}
.opt-edit{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.opt-edit input[type=radio]{accent-color:var(--primary);width:18px;height:18px;flex-shrink:0}
.opt-edit input[type=text]{flex:1}
/* Quiz page */
.quiz-progress{height:4px;background:var(--border);border-radius:2px;margin-bottom:16px;overflow:hidden}
.quiz-progress-bar{height:100%;background:var(--primary);border-radius:2px;transition:width .3s}
.quiz-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--text-light);margin-bottom:12px}
.quiz-q{font-size:18px;font-weight:600;line-height:1.5;margin-bottom:20px}
.opt-btn{display:block;width:100%;text-align:left;padding:14px 16px;margin-bottom:10px;border:1.5px solid var(--border);border-radius:12px;background:#fff;font-size:15px;color:var(--text);cursor:pointer;transition:all .15s;font-family:inherit;line-height:1.4}
.opt-btn:active{transform:scale(.98)}
.opt-btn.selected{border-color:var(--primary);background:#F0F8FF;color:var(--primary-dark)}
.opt-btn .opt-letter{display:inline-flex;width:26px;height:26px;align-items:center;justify-content:center;border-radius:50%;background:var(--bg);color:var(--primary);font-weight:700;font-size:13px;margin-right:10px;flex-shrink:0}
.opt-btn.selected .opt-letter{background:var(--primary);color:#fff}
.result-card{text-align:center;padding:28px 20px}
.result-card .score-num{font-size:48px;font-weight:700;color:var(--primary);line-height:1}
.result-card .score-label{font-size:14px;color:var(--text-light);margin:6px 0 18px}
.result-card .comment{font-size:16px;line-height:1.6;margin-bottom:16px;padding:14px;background:var(--bg);border-radius:12px}
.result-card .reward{font-size:15px;color:var(--primary-dark);font-weight:600;padding:12px 16px;border:1.5px dashed var(--primary);border-radius:12px;margin-bottom:8px}
.toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:rgba(44,62,80,.88);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:200;max-width:80%;text-align:center;pointer-events:none;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}
.footer-nav{text-align:center;padding:16px;font-size:13px}
.footer-nav a{color:var(--primary);text-decoration:none}
.section-divider{height:1px;background:var(--border);margin:16px 0}
.import-info{font-size:12px;color:var(--text-light);margin-top:6px;line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <!-- ========== SETUP VIEW ========== -->
  <div id="view-setup" class="view">
    <header class="app-header">
      <h1>知己测试</h1>
      <p>出题设置 · 看看谁最懂你</p>
    </header>

    <div class="card">
      <h2>题目列表 <span class="badge" id="q-count">0 题</span></h2>
      <div id="q-list"></div>
      <div class="btn-row">
        <button class="btn btn-secondary btn-sm" onclick="openQEditor(-1)">＋ 添加题目</button>
        <button class="btn btn-primary btn-sm" onclick="importBank()">一键导入题库</button>
      </div>
      <p class="import-info">内置 100 道通用知己题。导入时若已有题目将询问：替换 / 追加。</p>
    </div>

    <div class="card">
      <h2>奖励文案</h2>
      <label>答完后展示给好友的奖品说明</label>
      <textarea id="reward-text" rows="2" placeholder="例如：奶茶券一张 / 红包券 / 请客吃饭 / 电影票…"></textarea>
    </div>

    <div class="card">
      <h2>分段评语 <span class="badge">按正确数分档</span></h2>
      <p class="import-info" style="margin-bottom:10px" id="band-hint">根据当前题数自动划分 4 档区间，可自由编辑评语。</p>
      <div id="band-list"></div>
    </div>

    <button class="btn btn-primary" onclick="goQuiz()" style="margin:8px 16px;width:calc(100% - 32px)">开始答题 / 分享给好友 →</button>
    <div class="footer-nav">
      <span style="color:var(--text-light)">数据保存在本机浏览器 · 刷新不丢失</span>
    </div>
  </div>

  <!-- ========== QUIZ VIEW ========== -->
  <div id="view-quiz" class="view">
    <header class="app-header">
      <h1>知己测试</h1>
      <p id="quiz-subtitle">你有多了解我？</p>
    </header>
    <div id="quiz-area" style="padding:0 16px"></div>
    <div class="footer-nav">
      <a href="#setup" onclick="goSetup();return false;">✎ 编辑入口（出题人）</a>
    </div>
  </div>
</div>

<!-- Question Editor Modal -->
<div id="modal-mask" class="modal-mask" style="display:none" onclick="if(event.target===this)closeQEditor()">
  <div class="modal">
    <h3 id="modal-title">添加题目</h3>
    <label>题目</label>
    <textarea id="edit-q" rows="2" placeholder="输入题目…"></textarea>
    <label>选项（选中圆点表示正确答案）</label>
    <div class="opt-edit"><input type="radio" name="edit-ans" value="0" checked><input type="text" id="edit-o0" placeholder="选项 A"></div>
    <div class="opt-edit"><input type="radio" name="edit-ans" value="1"><input type="text" id="edit-o1" placeholder="选项 B"></div>
    <div class="opt-edit"><input type="radio" name="edit-ans" value="2"><input type="text" id="edit-o2" placeholder="选项 C"></div>
    <div class="opt-edit"><input type="radio" name="edit-ans" value="3"><input type="text" id="edit-o3" placeholder="选项 D"></div>
    <div class="btn-row" style="margin-top:16px">
      <button class="btn btn-secondary" onclick="closeQEditor()">取消</button>
      <button class="btn btn-primary" onclick="saveQEditor()">保存</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
/* ========== Question Bank: 100 知己题 ========== */
const BANK = [
{q:"我更喜欢怎样的周末？",options:["宅家追剧/游戏","户外走走逛逛","约朋友聚餐","睡到自然醒再看心情"],answer:0},

{q:"我更喜欢养什么宠物？",options:["猫","狗","都不想养","都可以/小众宠物"],answer:0},

{q:"我更喜欢的面包/主食？",options:["甜面包蛋糕类","咸口肉松/三明治","米饭面食为主","低碳水少吃主食"],answer:2},

const STORAGE_KEY = 'zhiji-quiz-v1';
const LETTERS = ['A','B','C','D'];

const DEFAULT_REWARD = '恭喜获得：奶茶券一张（可找出题人兑换～）';
const DEFAULT_BAND_TEXTS = [
  '看来我们还需要多了解彼此呢，下次再来挑战！',
  '有点懂我，但还有盲区哦，继续加油！',
  '不错嘛，你真的有在认真观察我！',
  '知己啊！！你也太懂我了吧，奖励安排上！'
];

let state = {
  questions: [],
  reward: DEFAULT_REWARD,
  bandTexts: [...DEFAULT_BAND_TEXTS],
  quizIndex: 0,
  answers: [],
  phase: 'answering' // answering | result
};
let editIndex = -1;

/* ---------- Persistence ---------- */
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      if (Array.isArray(data.questions)) state.questions = data.questions;
      if (typeof data.reward === 'string') state.reward = data.reward;
      if (Array.isArray(data.bandTexts) && data.bandTexts.length === 4) state.bandTexts = data.bandTexts;
    }
  } catch (e) {}
  if (state.questions.length === 0) {
    // first load: 5 sample questions from bank
    state.questions = BANK.slice(0, 5).map(q => ({...q, options: [...q.options]}));
  }
}

function saveState() {
  const data = {
    questions: state.questions,
    reward: state.reward,
    bandTexts: state.bandTexts
  };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

/* ---------- Band ranges (dynamic by question count) ---------- */
function getBandRanges(n) {
  if (n <= 0) return [[0,0],[0,0],[0,0],[0,0]];
  // 4 bands by percentage: 0-30%, 31-55%, 56-80%, 81-100%
  const cuts = [
    0,
    Math.max(0, Math.floor(n * 0.3)),
    Math.max(0, Math.floor(n * 0.55)),
    Math.max(0, Math.floor(n * 0.8)),
    n
  ];
  // ensure non-decreasing and cover 0..n
  for (let i = 1; i < cuts.length; i++) {
    if (cuts[i] < cuts[i-1]) cuts[i] = cuts[i-1];
  }
  cuts[cuts.length - 1] = n;
  const ranges = [];
  for (let i = 0; i < 4; i++) {
    let lo = i === 0 ? 0 : cuts[i] + 1;
    let hi = cuts[i + 1];
    if (lo > hi) { lo = hi; }
    // fix overlapping when n is small
    ranges.push([lo, hi]);
  }
  // special handling for small n to avoid empty weird ranges
  if (n <= 3) {
    return [[0,0],[1,1],[2, Math.min(2,n)],[Math.min(3,n), n]].map(r => [Math.min(r[0],n), Math.min(r[1],n)]);
  }
  return ranges;
}

function bandIndexForScore(score, n) {
  const ranges = getBandRanges(n);
  for (let i = ranges.length - 1; i >= 0; i--) {
    if (score >= ranges[i][0] && score <= ranges[i][1]) return i;
  }
  return 0;
}

/* ---------- Toast ---------- */
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

/* ---------- Setup UI ---------- */
function renderSetup() {
  document.getElementById('reward-text').value = state.reward;
  document.getElementById('q-count').textContent = state.questions.length + ' 题';
  const list = document.getElementById('q-list');
  if (state.questions.length === 0) {
    list.innerHTML = '<div class="empty-hint"><div class="emoji">📝</div>还没有题目<br>点击下方添加，或一键导入 100 道题库</div>';
  } else {
    list.innerHTML = state.questions.map((q, i) => `
      <div class="q-item">
        <div class="q-text">${i + 1}. ${escapeHtml(q.q)}</div>
        <div class="q-opts">${q.options.map((o, j) =>
          `<div class="${j === q.answer ? 'correct' : ''}">${LETTERS[j]}. ${escapeHtml(o)}${j === q.answer ? ' ✓' : ''}</div>`
        ).join('')}</div>
        <div class="q-actions">
          <button class="btn btn-ghost btn-sm" onclick="openQEditor(${i})">编辑</button>
          <button class="btn btn-danger" onclick="deleteQ(${i})">删除</button>
        </div>
      </div>
    `).join('');
  }
  renderBands();
}

function renderBands() {
  const n = state.questions.length;
  const ranges = getBandRanges(n);
  document.getElementById('band-hint').textContent =
    n === 0 ? '请先添加题目，评语区间将按题数自动划分。'
    : `当前共 ${n} 题，按答对数量分为 4 档（可改文案）：`;
  const box = document.getElementById('band-list');
  box.innerHTML = ranges.map((r, i) => `
    <div class="band-row">
      <div class="band-range">${r[0] === r[1] ? r[0] + ' 题' : r[0] + '-' + r[1] + ' 题'}</div>
      <textarea data-band="${i}" rows="2" onchange="onBandChange(${i}, this.value)" oninput="onBandChange(${i}, this.value)">${escapeHtml(state.bandTexts[i] || '')}</textarea>
    </div>
  `).join('');
}

function onBandChange(i, val) {
  state.bandTexts[i] = val;
  saveState();
}

function onRewardChange() {
  state.reward = document.getElementById('reward-text').value;
  saveState();
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ---------- Question CRUD ---------- */
function openQEditor(idx) {
  editIndex = idx;
  document.getElementById('modal-title').textContent = idx < 0 ? '添加题目' : '编辑题目';
  if (idx >= 0) {
    const q = state.questions[idx];
    document.getElementById('edit-q').value = q.q;
    for (let i = 0; i < 4; i++) document.getElementById('edit-o' + i).value = q.options[i] || '';
    const radios = document.querySelectorAll('input[name="edit-ans"]');
    radios.forEach(r => { r.checked = Number(r.value) === q.answer; });
  } else {
    document.getElementById('edit-q').value = '';
    for (let i = 0; i < 4; i++) document.getElementById('edit-o' + i).value = '';
    document.querySelector('input[name="edit-ans"][value="0"]').checked = true;
  }
  document.getElementById('modal-mask').style.display = 'flex';
}

function closeQEditor() {
  document.getElementById('modal-mask').style.display = 'none';
}

function saveQEditor() {
  const qText = document.getElementById('edit-q').value.trim();
  const options = [0,1,2,3].map(i => document.getElementById('edit-o' + i).value.trim());
  const ansEl = document.querySelector('input[name="edit-ans"]:checked');
  const answer = ansEl ? Number(ansEl.value) : 0;
  if (!qText) { toast('请填写题目'); return; }
  if (options.some(o => !o)) { toast('请填完四个选项'); return; }
  const item = { q: qText, options, answer };
  if (editIndex < 0) state.questions.push(item);
  else state.questions[editIndex] = item;
  saveState();
  closeQEditor();
  renderSetup();
  toast(editIndex < 0 ? '已添加' : '已保存');
}

function deleteQ(i) {
  if (!confirm('确定删除这道题？')) return;
  state.questions.splice(i, 1);
  saveState();
  renderSetup();
  toast('已删除');
}

function importBank() {
  if (state.questions.length === 0) {
    state.questions = BANK.map(q => ({ q: q.q, options: [...q.options], answer: q.answer }));
    saveState();
    renderSetup();
    toast('已导入 100 道题库');
    return;
  }
  const choice = confirm('当前已有 ' + state.questions.length + ' 道题。\n\n点击「确定」= 替换为题库 100 题\n点击「取消」= 追加题库到现有题目');
  if (choice) {
    state.questions = BANK.map(q => ({ q: q.q, options: [...q.options], answer: q.answer }));
    toast('已替换为 100 道题库');
  } else {
    // append — ask again? cancel means append per our message
    const doAppend = confirm('是否将 100 道题库追加到现有题目之后？\n（点取消则不做任何操作）');
    if (!doAppend) return;
    const existing = state.questions.map(q => q.q);
    let added = 0;
    BANK.forEach(q => {
      if (!existing.includes(q.q)) {
        state.questions.push({ q: q.q, options: [...q.options], answer: q.answer });
        added++;
      }
    });
    toast('已追加 ' + added + ' 道新题');
  }
  saveState();
  renderSetup();
}

/* ---------- Routing ---------- */
function goSetup() {
  location.hash = '#setup';
  showView('setup');
}

function goQuiz() {
  if (state.questions.length === 0) {
    toast('请先添加或导入题目');
    return;
  }
  // sync reward before leave
  onRewardChange();
  state.quizIndex = 0;
  state.answers = [];
  state.phase = 'answering';
  location.hash = '#quiz';
  showView('quiz');
  renderQuiz();
}

function showView(name) {
  document.getElementById('view-setup').classList.toggle('active', name === 'setup');
  document.getElementById('view-quiz').classList.toggle('active', name === 'quiz');
  if (name === 'setup') renderSetup();
  window.scrollTo(0, 0);
}

function applyHash() {
  const h = (location.hash || '#setup').replace('#', '');
  if (h === 'quiz') {
    if (state.questions.length === 0) {
      location.hash = '#setup';
      showView('setup');
      toast('请先添加题目');
      return;
    }
    if (state.phase !== 'result') {
      state.quizIndex = 0;
      state.answers = [];
      state.phase = 'answering';
    }
    showView('quiz');
    renderQuiz();
  } else {
    showView('setup');
  }
}

/* ---------- Quiz UI ---------- */
function renderQuiz() {
  const area = document.getElementById('quiz-area');
  const n = state.questions.length;
  if (state.phase === 'result') {
    const score = state.answers.reduce((s, a, i) => s + (a === state.questions[i].answer ? 1 : 0), 0);
    const bi = bandIndexForScore(score, n);
    const comment = state.bandTexts[bi] || '';
    area.innerHTML = `
      <div class="card result-card">
        <div class="score-num">${score}<span style="font-size:20px;color:var(--text-light)"> / ${n}</span></div>
        <div class="score-label">答对题数</div>
        <div class="comment">${escapeHtml(comment)}</div>
        <div class="reward">🎁 ${escapeHtml(state.reward || DEFAULT_REWARD)}</div>
        <button class="btn btn-primary" onclick="restartQuiz()" style="margin-top:16px">再测一次</button>
        <button class="btn btn-secondary" onclick="goSetup()" style="margin-top:8px">返回编辑</button>
      </div>
    `;
    return;
  }
  const i = state.quizIndex;
  const q = state.questions[i];
  const pct = Math.round((i / n) * 100);
  area.innerHTML = `
    <div class="quiz-progress"><div class="quiz-progress-bar" style="width:${pct}%"></div></div>
    <div class="quiz-meta"><span>第 ${i + 1} / ${n} 题</span><span>知己挑战</span></div>
    <div class="card">
      <div class="quiz-q">${escapeHtml(q.q)}</div>
      ${q.options.map((o, j) => `
        <button class="opt-btn" onclick="pickOption(${j})">
          <span class="opt-letter">${LETTERS[j]}</span>${escapeHtml(o)}
        </button>
      `).join('')}
    </div>
  `;
}

function pickOption(j) {
  state.answers[state.quizIndex] = j;
  if (state.quizIndex >= state.questions.length - 1) {
    state.phase = 'result';
    renderQuiz();
  } else {
    state.quizIndex++;
    renderQuiz();
  }
}

function restartQuiz() {
  state.quizIndex = 0;
  state.answers = [];
  state.phase = 'answering';
  renderQuiz();
}

/* ---------- Init ---------- */
document.getElementById('reward-text').addEventListener('change', onRewardChange);
document.getElementById('reward-text').addEventListener('blur', onRewardChange);
window.addEventListener('hashchange', applyHash);

loadState();
if (!location.hash) location.hash = '#setup';
applyHash();
</script>
