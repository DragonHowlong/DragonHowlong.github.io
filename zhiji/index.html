<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>默契测试 · 你有多了解我</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root,html[data-theme="cute"]{
  --bg:#EAF6F3;
  --bg2:#E8F4FC;
  --card:#ffffff;
  --primary:#4BA3C7;
  --primary-dark:#3A8FB0;
  --primary-soft:#D6EEF7;
  --green:#5CB88A;
  --green-soft:#E6F6EE;
  --mint:#7BC9A6;
  --text:#2C3E50;
  --text-light:#7A8A9A;
  --border:#D0E8E2;
  --danger:#E8747A;
  --danger-soft:#FFF0F0;
  --warn:#E8A838;
  --radius:16px;
  --shadow:0 4px 16px rgba(75,163,199,.12);
  --header-1:#4BA3C7;
  --header-2:#6BB3E0;
  --header-3:#7BC9A6;
  --input-bg:#FAFDFC;
  --chip-bg:#ffffff;
  --opt-bg:#ffffff;
  --opt-selected-bg:#F0F9FC;
  --progress-track:#C5DDE8;
  --quiz-track:rgba(208,232,226,.9);
  --soft-grad-a:#F0F9FC;
  --soft-grad-b:#EAF7F1;
  --reward-bg:#FBFEFF;
  --no-reward-bg:#F7F8FA;
  --tip-bg:#FFF8E8;
  --tip-border:#F0D9A0;
  --tip-text:#7A5A20;
  --modal-bg:#ffffff;
  --bank-item-bg:#FAFDFC;
  --slot-empty-bg:#F3F5F7;
  --btn-sec-bg:#ffffff;
  --danger-border:#F5D0D0;
  --bgm-bg:rgba(255,255,255,.92);
  --primary-rgb:75,163,199;
}
html[data-theme="mono"]{
  --bg:#F4F4F4;
  --bg2:#EEEEEE;
  --card:#ffffff;
  --primary:#111111;
  --primary-dark:#000000;
  --primary-soft:#E8E8E8;
  --green:#222222;
  --green-soft:#F0F0F0;
  --mint:#444444;
  --text:#111111;
  --text-light:#666666;
  --border:#D0D0D0;
  --danger:#B00020;
  --danger-soft:#FCE8EC;
  --warn:#555555;
  --shadow:0 4px 16px rgba(0,0,0,.08);
  --header-1:#111111;
  --header-2:#333333;
  --header-3:#555555;
  --input-bg:#FAFAFA;
  --chip-bg:#ffffff;
  --opt-bg:#ffffff;
  --opt-selected-bg:#F2F2F2;
  --progress-track:#D8D8D8;
  --quiz-track:#E6E6E6;
  --soft-grad-a:#F7F7F7;
  --soft-grad-b:#EFEFEF;
  --reward-bg:#FAFAFA;
  --no-reward-bg:#F5F5F5;
  --tip-bg:#F7F7F7;
  --tip-border:#D0D0D0;
  --tip-text:#333333;
  --modal-bg:#ffffff;
  --bank-item-bg:#FAFAFA;
  --slot-empty-bg:#F0F0F0;
  --btn-sec-bg:#ffffff;
  --danger-border:#E8B4BE;
  --bgm-bg:rgba(255,255,255,.95);
  --primary-rgb:17,17,17;
}
html[data-theme="dark"]{
  --bg:#12141A;
  --bg2:#1A1D26;
  --card:#232733;
  --primary:#6EC1E0;
  --primary-dark:#8AD0EA;
  --primary-soft:#2A3A48;
  --green:#6BCF9B;
  --green-soft:#1E3A2E;
  --mint:#5CB88A;
  --text:#E8ECF2;
  --text-light:#9AA3B2;
  --border:#343B4A;
  --danger:#F08A8F;
  --danger-soft:#3A2426;
  --warn:#E8B86D;
  --shadow:0 4px 18px rgba(0,0,0,.45);
  --header-1:#2A4A5C;
  --header-2:#3A6A7A;
  --header-3:#3A6B58;
  --input-bg:#1A1D26;
  --chip-bg:#1E222C;
  --opt-bg:#1E222C;
  --opt-selected-bg:#2A3A48;
  --progress-track:#3A4152;
  --quiz-track:#2A303C;
  --soft-grad-a:#1E2A32;
  --soft-grad-b:#1E2E28;
  --reward-bg:#1E2A32;
  --no-reward-bg:#1A1D26;
  --tip-bg:#2A2618;
  --tip-border:#5A4A20;
  --tip-text:#E8D5A0;
  --modal-bg:#232733;
  --bank-item-bg:#1A1D26;
  --slot-empty-bg:#2A303C;
  --btn-sec-bg:#1E222C;
  --danger-border:#5A3438;

  --primary-rgb:110,193,224;
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:linear-gradient(180deg,var(--bg2) 0%,var(--bg) 100%);color:var(--text);-webkit-tap-highlight-color:transparent}
#app{max-width:430px;margin:0 auto;min-height:100%;position:relative;padding-bottom:calc(28px + env(safe-area-inset-bottom))}
.view{display:none;padding:0 0 24px;animation:fadeIn .25s ease}
.view.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
header.app-header{background:linear-gradient(135deg,var(--header-1) 0%,var(--header-2) 55%,var(--header-3) 100%);color:#fff;padding:28px 20px 24px;border-radius:0 0 28px 28px;text-align:center;margin-bottom:14px;position:relative;overflow:hidden}
header.app-header::after{content:"";position:absolute;right:-20px;top:-20px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12)}
header.app-header h1{font-size:22px;font-weight:700;letter-spacing:1px;position:relative}
header.app-header p{font-size:13px;opacity:.92;margin-top:6px;position:relative}
.step-pill{display:inline-block;background:rgba(255,255,255,.22);padding:4px 12px;border-radius:20px;font-size:12px;margin-top:10px;position:relative}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin:0 14px 12px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card h2{font-size:16px;margin-bottom:12px;color:var(--primary-dark);display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h2 .badge{font-size:12px;background:var(--primary-soft);color:var(--primary-dark);padding:2px 10px;border-radius:10px;font-weight:600}
label{display:block;font-size:13px;color:var(--text-light);margin-bottom:4px;margin-top:10px}
input[type=text],input[type=number],textarea,select{width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:12px;font-size:14px;background:var(--input-bg);color:var(--text);outline:none;transition:border .2s;font-family:inherit}
input:focus,textarea:focus,select:focus{border-color:var(--primary)}
textarea{resize:vertical;min-height:64px;line-height:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border:none;border-radius:14px;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .15s,transform .1s;font-family:inherit;width:100%;margin-top:8px}
.btn:active{transform:scale(.97);opacity:.9}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;box-shadow:0 4px 12px rgba(var(--primary-rgb),.28)}
.btn-secondary{background:var(--btn-sec-bg);color:var(--primary-dark);border:1.5px solid var(--primary)}
.btn-mint{background:linear-gradient(135deg,var(--mint),var(--green));color:#fff}
.btn-danger{background:var(--danger-soft);color:var(--danger);border:1px solid var(--danger-border);font-size:13px;padding:7px 12px;width:auto;margin:0}
.btn-ghost{background:transparent;color:var(--text-light);font-size:13px;padding:8px;width:auto;margin:0}
.btn-sm{padding:9px 12px;font-size:13px;width:auto;margin:0;border-radius:12px}
.btn-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn-row .btn{flex:1;margin-top:0;min-width:0}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{padding:8px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--chip-bg);font-size:13px;color:var(--text);cursor:pointer;font-family:inherit}
.chip.active{border-color:var(--primary);background:var(--primary-soft);color:var(--primary-dark);font-weight:600}
.progress-dots{display:flex;gap:5px;justify-content:center;margin:4px 0 12px;padding:0 16px}
.progress-dots span{width:8px;height:8px;border-radius:50%;background:var(--progress-track);transition:all .2s}
.progress-dots span.done{background:var(--green)}
.progress-dots span.cur{background:var(--primary);width:18px;border-radius:6px}
.quiz-progress{height:5px;background:var(--quiz-track);border-radius:3px;margin:0 14px 14px;overflow:hidden}
.quiz-progress-bar{height:100%;background:linear-gradient(90deg,var(--primary),var(--mint));border-radius:3px;transition:width .3s}
.quiz-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--text-light);margin:0 16px 10px}
.quiz-q{font-size:18px;font-weight:650;line-height:1.55;margin-bottom:18px}
.opt-btn{display:flex;align-items:center;width:100%;text-align:left;padding:13px 14px;margin-bottom:10px;border:1.5px solid var(--border);border-radius:14px;background:var(--opt-bg);font-size:15px;color:var(--text);cursor:pointer;transition:all .15s;font-family:inherit;line-height:1.4}
.opt-btn:active{transform:scale(.98)}
.opt-btn.selected{border-color:var(--primary);background:var(--opt-selected-bg);color:var(--primary-dark)}
.opt-btn.correct-mark{border-color:var(--green);background:var(--green-soft)}
.opt-letter{display:inline-flex;width:26px;height:26px;align-items:center;justify-content:center;border-radius:50%;background:var(--bg2);color:var(--primary);font-weight:700;font-size:13px;margin-right:10px;flex-shrink:0}
.opt-btn.selected .opt-letter{background:var(--primary);color:#fff}
.opt-btn.correct-mark .opt-letter{background:var(--green);color:#fff}
.opt-edit{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.opt-edit input[type=radio]{accent-color:var(--primary);width:18px;height:18px;flex-shrink:0}
.opt-edit input[type=text]{flex:1}
.opt-edit .rm{flex-shrink:0;width:32px;height:32px;border-radius:10px;border:1px solid var(--danger-border);background:var(--danger-soft);color:var(--danger);font-size:16px;cursor:pointer}
.result-card{text-align:center;padding:26px 18px}
.result-card .score-num{font-size:52px;font-weight:750;color:var(--primary);line-height:1}
.result-card .score-label{font-size:14px;color:var(--text-light);margin:6px 0 16px}
.result-card .comment{font-size:15px;line-height:1.65;margin-bottom:14px;padding:14px;background:linear-gradient(135deg,var(--soft-grad-a),var(--soft-grad-b));border-radius:14px}
.result-card .reward{font-size:15px;color:var(--primary-dark);font-weight:650;padding:14px 16px;border:1.5px dashed var(--primary);border-radius:14px;margin-bottom:8px;background:var(--reward-bg)}
.result-card .no-reward{font-size:14px;color:var(--text-light);padding:12px;background:var(--no-reward-bg);border-radius:12px;margin-bottom:8px}
.reward-preview{display:flex;align-items:center;gap:12px;padding:12px;background:linear-gradient(135deg,var(--soft-grad-a),var(--soft-grad-b));border-radius:14px;margin-top:8px}
.reward-preview .emoji{font-size:28px}
.reward-preview .txt{flex:1;text-align:left}
.reward-preview .txt b{display:block;font-size:15px;color:var(--primary-dark)}
.reward-preview .txt span{font-size:12px;color:var(--text-light)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.stat-box{background:var(--bg2);border-radius:12px;padding:14px 10px;text-align:center}
.stat-box .n{font-size:24px;font-weight:700;color:var(--primary-dark)}
.stat-box .l{font-size:12px;color:var(--text-light);margin-top:2px}
.hint{font-size:12px;color:var(--text-light);line-height:1.55;margin-top:8px}
.band-row{display:flex;gap:8px;align-items:flex-start;margin-bottom:10px}
.band-row .band-range{flex:0 0 78px;font-size:12px;color:var(--primary);font-weight:600;padding-top:12px;text-align:center}
.band-row textarea{flex:1;min-height:52px}
.modal-mask{position:fixed;inset:0;background:rgba(30,50,60,.45);z-index:100;display:flex;align-items:flex-end;justify-content:center;max-width:430px;margin:0 auto}
.modal{background:var(--modal-bg);border-radius:22px 22px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));width:100%;max-height:88vh;overflow-y:auto;color:var(--text)}
.modal h3{font-size:17px;margin-bottom:12px;text-align:center}
.bank-list{max-height:46vh;overflow-y:auto}
.bank-item{padding:12px;border:1px solid var(--border);border-radius:12px;margin-bottom:8px;cursor:pointer;background:var(--bank-item-bg)}
.bank-item:active{background:var(--primary-soft)}
.bank-item.used{opacity:.45;cursor:not-allowed;background:var(--slot-empty-bg)}
.bank-item .bq{font-size:14px;font-weight:550;margin-bottom:4px}
.bank-item .bo{font-size:12px;color:var(--text-light);line-height:1.5}
.bank-item .tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:8px;background:var(--green-soft);color:var(--green);margin-bottom:4px;font-weight:600}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:rgba(44,62,80,.9);color:#fff;padding:10px 18px;border-radius:22px;font-size:13px;z-index:200;max-width:82%;text-align:center;pointer-events:none;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}
.footer-note{text-align:center;padding:8px 20px;font-size:12px;color:var(--text-light);line-height:1.5}
.hero-emoji{font-size:42px;margin-bottom:8px}
.meme-hero{display:block;width:min(180px,46vw);height:auto;margin:0 auto 12px;border-radius:18px;box-shadow:0 6px 18px rgba(var(--primary-rgb),.18);object-fit:cover;animation:memeFloat 3.2s ease-in-out infinite}
.meme-result{display:block;width:min(160px,42vw);height:auto;margin:0 auto 14px;border-radius:16px;box-shadow:0 4px 14px rgba(var(--primary-rgb),.16);object-fit:cover}
@keyframes memeFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.intro-title{font-size:20px;font-weight:700;line-height:1.4;margin-bottom:8px;color:var(--text)}
.slot-tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 8px;border-radius:8px;background:var(--green-soft);color:var(--green);font-weight:600}
.slot-tag.empty{background:var(--slot-empty-bg);color:var(--text-light)}
.leaderboard{margin-top:10px}
.lb-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}
.lb-row:last-child{border-bottom:none}
.lb-score{color:var(--primary-dark);font-weight:650}
.search-box{margin-bottom:10px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.toolbar .btn{flex:1 1 calc(50% - 8px);min-width:100px}
.num-row{display:flex;gap:10px;align-items:center}
.num-row input{flex:1}
.q-preview{font-size:15px;font-weight:600;line-height:1.5;margin-bottom:12px;padding:12px;background:var(--bg2);border-radius:12px}
.cat-tabs{display:flex;flex-wrap:nowrap;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 0 10px;margin-bottom:4px}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-tab{flex:0 0 auto;padding:7px 12px;border-radius:16px;border:1.5px solid var(--border);background:var(--chip-bg);font-size:12px;color:var(--text);cursor:pointer;font-family:inherit;white-space:nowrap}
.cat-tab.active{border-color:var(--primary);background:var(--primary-soft);color:var(--primary-dark);font-weight:650}
.tip-box{background:var(--tip-bg);border:1px solid var(--tip-border);border-radius:12px;padding:12px;font-size:13px;line-height:1.55;color:var(--tip-text);margin-top:10px}
.tip-box b{display:block;margin-bottom:4px}
.msg-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.msg-actions .btn{margin-top:0}
.msg-list{margin-top:8px}
.msg-item{padding:12px 0;border-bottom:1px solid var(--border)}
.msg-item:last-child{border-bottom:none}
.msg-item .who{font-size:13px;font-weight:650;color:var(--primary-dark);margin-bottom:4px}
.msg-item .when{font-size:11px;color:var(--text-light);margin-top:6px}
.msg-item .body{font-size:14px;line-height:1.55;word-break:break-word}
.corner-msg{display:flex;gap:8px;justify-content:flex-end;margin:0 0 10px}
.corner-msg .btn{flex:0 0 auto;width:auto;padding:8px 12px;margin:0;font-size:13px}
.dev-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dev-grid .stat-box .n{font-size:28px}
.action-bar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.action-bar .btn{margin-top:0}
.action-bar .span2{grid-column:1 / -1}

.qr-wrap{display:flex;flex-direction:column;align-items:center;text-align:center;padding:8px 0 4px}
.qr-wrap img,.qr-wrap canvas{width:min(72vw,260px);height:auto;border-radius:12px;background:#fff;padding:10px;box-shadow:0 2px 10px rgba(var(--primary-rgb),.15);border:1px solid var(--border);image-rendering:pixelated}
.qr-caption{font-size:14px;font-weight:650;color:var(--primary-dark);margin:12px 0 4px}
.qr-sub{font-size:12px;color:var(--text-light);line-height:1.5;margin:0 8px 8px}
.poster-wrap{display:flex;flex-direction:column;align-items:center;text-align:center;padding:4px 0 8px;margin-top:8px}
.poster-wrap img{width:min(86vw,320px);height:auto;border-radius:16px;background:#d6e4ff;box-shadow:0 4px 16px rgba(var(--primary-rgb),.18);border:1px solid var(--border);-webkit-touch-callout:default}
.poster-wrap .hint{margin-top:8px}

.bgm-toggle{position:fixed;top:calc(12px + env(safe-area-inset-top));right:max(12px, env(safe-area-inset-right));z-index:300;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--border);background:var(--bgm-bg);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1;cursor:pointer;color:var(--primary-dark);padding:0;-webkit-tap-highlight-color:transparent;backdrop-filter:blur(6px)}
.bgm-toggle:active{transform:scale(.94)}
.bgm-toggle[aria-pressed="true"]{background:var(--primary-soft);border-color:var(--primary)}

.theme-picker{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.theme-chip{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px;border-radius:14px;border:1.5px solid var(--border);background:var(--chip-bg);cursor:pointer;font-family:inherit;color:var(--text);font-size:12px;line-height:1.3}
.theme-chip .swatch{width:100%;height:28px;border-radius:10px;border:1px solid var(--border)}
.theme-chip.active{border-color:var(--primary);background:var(--primary-soft);font-weight:650;color:var(--primary-dark)}
.theme-chip .swatch.cute{background:linear-gradient(90deg,#E8F4FC,#EAF6F3,#7BC9A6)}
.theme-chip .swatch.mono{background:linear-gradient(90deg,#111,#888,#f4f4f4)}
.theme-chip .swatch.dark{background:linear-gradient(90deg,#12141A,#2A4A5C,#6EC1E0)}
.tpl-list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.tpl-card{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;padding:12px;border-radius:14px;border:1.5px solid var(--border);background:var(--chip-bg);cursor:pointer;font-family:inherit;color:var(--text)}
.tpl-card:active{transform:scale(.98);opacity:.92}
.tpl-card .te{font-size:26px;line-height:1;flex-shrink:0;margin-top:2px}
.tpl-card .tb{flex:1;min-width:0}
.tpl-card .tn{font-size:14px;font-weight:650;margin-bottom:2px}
.tpl-card .td{font-size:12px;color:var(--text-light);line-height:1.45}
.section-label{font-size:13px;font-weight:650;color:var(--primary-dark);margin:4px 0 2px}
html[data-theme="mono"] .btn-primary,html[data-theme="mono"] .btn-mint{background:#111;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.2)}
html[data-theme="mono"] header.app-header{background:#111}
.lb-remote-hook{min-height:24px}


</style>
</head>
<body>
<div id="app"></div>
<audio id="bgm" loop preload="auto" autoplay playsinline webkit-playsinline>
  <source src="audio/undead-funeral-march.m4a" type="audio/mp4">
  <source src="audio/undead-funeral-march.mp3" type="audio/mpeg">
</audio>
<button type="button" id="bgm-toggle" class="bgm-toggle" aria-label="切换背景音乐静音" aria-pressed="false" title="背景音乐">🔊</button>
<div id="toast" class="toast"></div>

function normalizeTheme(t){
  t=String(t||'cute');
  return THEME_IDS.indexOf(t)>=0 ? t : 'cute';
}
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', normalizeTheme(theme));
}
function setDraftTheme(theme){
  if(!S.draft) loadDraft();
  const keepTheme = normalizeTheme(theme);
  // Selecting theme before create: keep into draft immediately + live preview
  if(!S.draft.theme || S.draft.theme !== keepTheme){
    S.draft.theme = keepTheme;
    saveDraft();
  } else {
    S.draft.theme = keepTheme;
    saveDraft();
  }
  applyTheme(keepTheme);
  if(S.route==='home') render();
}
function syncThemeForRoute(){
  let t='cute';
  if(S.playQuiz && S.playQuiz.theme) t=S.playQuiz.theme;
  else if(S.route==='manage' && S.published && S.published.theme) t=S.published.theme;
  else if(S.draft && S.draft.theme) t=S.draft.theme;
  applyTheme(t);
}

function templateById(id){
  return TEMPLATES.find(t=>t.id===id) || null;
}
function applyTemplate(id){
  if(hasFriendLink()){ toast('当前为答题链接'); return; }
  const tpl=templateById(id);
  if(!tpl){ toast('模板不存在'); return; }
  const d=defaultDraft();
  // skin stays independent of template
  d.theme=normalizeTheme((S.draft&&S.draft.theme) || document.documentElement.getAttribute('data-theme') || 'cute');
  d.name=tpl.nameHint||'';
  d.title=tpl.titleHint||'';
  d.reward=tpl.reward||'奶茶券';
  d.rewardCustom='';
  d.step=0;
  d.slots=(tpl.questions||[]).slice(0,Q_COUNT).map(q=>({
    q:q.q,
    options:[...(q.options||[])],
    answer:clamp(q.answer|0,0,Math.max(0,(q.options||[]).length-1)),
    filled:true
  }));
  while(d.slots.length<Q_COUNT){
    d.slots.push({q:'',options:['','',''],answer:0,filled:false});
  }
  S.draft=d;
  saveDraft();
  applyTheme(d.theme);
  navigate('create');
  toast('已加载模板，请确认每题你的答案');
}

  const n=Number(at);
  if(!Number.isFinite(n)||!n) return '';
  try{
    const d=new Date(n);

    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());
  }catch(e){ return ''; }
}

  if(!box) return;

  // keep secret query on refresh button path
  try{
    if(isDevMode()) history.replaceState(null,'', location.pathname + '?dev=' + encodeURIComponent(DEV_TOKEN) + '#dev');
  }catch(e){}
  const data=await fetchSiteStatsRemote();
  if(data&&data.site){
    try{ localStorage.setItem('zhiji_dev_stats_cache', JSON.stringify({site:data.site, at:Date.now()})); }catch(e){}
    box.innerHTML=renderDevSite(data.site);
    return;
  }
  let cached=null;

    box.innerHTML=renderDevSite(cached.site, '实时拉取失败（常见：微信拦截 workers.dev）。以下是上次成功缓存 · '+fmtMsgTime(cached.at));

const MEME_POOL = {
  entry: ['memes/m01.jpg','memes/m05.jpg','memes/m08.jpg','memes/m06.jpg','memes/m07.jpg','memes/m03.jpg'],
  locked: ['memes/m04.jpg','memes/m09.jpg'],
  byScore: {
    low: ['memes/m09.jpg','memes/m11.jpg','memes/m04.jpg'],   // 0-3
    mid: ['memes/m02.jpg','memes/m03.jpg','memes/m01.jpg'],   // 4-6
    high: ['memes/m05.jpg','memes/m07.jpg','memes/m06.jpg'],  // 7-8
    top: ['memes/m08.jpg','memes/m10.jpg','memes/m05.jpg']    // 9-10
  }
};
function memeImg(src, cls){
  if(!src) return '';
  return '<img class="'+cls+'" src="'+src+'" alt="" loading="lazy" onerror="this.style.display=\'none\'">';
}
function hashPick(key, arr){
  if(!arr||!arr.length) return null;
  let h=0; const s=String(key||'');
  for(let i=0;i<s.length;i++) h=((h<<5)-h)+s.charCodeAt(i)|0;
  return arr[Math.abs(h)%arr.length];
}
function pickEntryMeme(){
  try{
    const k='zhiji-entry-meme';
    let id=sessionStorage.getItem(k);
    if(id && MEME_POOL.entry.includes(id)) return id;
    id=MEME_POOL.entry[Math.floor(Math.random()*MEME_POOL.entry.length)];
    sessionStorage.setItem(k,id);
    return id;
  }catch(e){
    return MEME_POOL.entry[0];
  }
}
function pickResultMeme(score, quizId){
  const s=score|0;
  let pool=MEME_POOL.byScore.mid;
  if(s<=3) pool=MEME_POOL.byScore.low;
  else if(s<=6) pool=MEME_POOL.byScore.mid;
  else if(s<=8) pool=MEME_POOL.byScore.high;
  else pool=MEME_POOL.byScore.top;
  return hashPick((quizId||'')+':'+s, pool);
}
function pickLockedMeme(quizId){
  return hashPick('locked:'+(quizId||''), MEME_POOL.locked);
}


function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function escapeHtml(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}

let toastTimer=null;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2200);

/* ---------- Encode / decode share payload ---------- */
function toBase64Url(str){
  const bytes=new TextEncoder().encode(str);
  let bin='';
  bytes.forEach(b=>bin+=String.fromCharCode(b));
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function fromBase64Url(s){
  s=String(s||'').replace(/-/g,'+').replace(/_/g,'/');
  while(s.length%4)s+='=';
  const bin=atob(s);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function lzCompressB64Url(str){
  try{
    if(typeof LZString==='undefined') return null;
    const z=LZString.compressToBase64(str);
    if(!z) return null;
    return z.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  }catch(e){return null}
}
function lzDecompressB64Url(s){
  try{
    if(typeof LZString==='undefined') return null;
    let t=String(s||'').replace(/-/g,'+').replace(/_/g,'/');
    while(t.length%4)t+='=';
    return LZString.decompressFromBase64(t);
  }catch(e){return null}
}
function findBankIdx(question){
  if(!question) return -1;
  if(typeof question.bankIdx==='number' && BANK[question.bankIdx] && BANK[question.bankIdx].q===question.q) return question.bankIdx;
  const q=question.q, opts=question.options||question.o||[];
  for(let i=0;i<BANK.length;i++){
    const b=BANK[i];
    if(b.q!==q) continue;
    if(b.options.length!==opts.length) continue;
    let ok=true;
    for(let j=0;j<opts.length;j++){ if(b.options[j]!==opts[j]){ok=false;break;} }
    if(ok) return i;
  }
  return -1;
}
function compactQuestion(x){
  const bi=findBankIdx(x);
  if(bi>=0) return {b:bi,a:x.answer|0};
  return {q:x.q,o:x.options||x.o,a:x.answer|0};
}
function expandQuestion(x){
  if(x && typeof x.b==='number'){
    const b=BANK[x.b];
    if(!b) throw new Error('bad bank idx');
    return {q:b.q,options:[...b.options],answer:x.a|0,bankIdx:x.b};
  }
  return {q:x.q,options:x.o||x.options||[],answer:x.a|0};
}
function encodeQuiz(quiz){
  const compact={
    i:quiz.id,
    n:quiz.name||'',
    t:quiz.title||'',
    r:quiz.reward||'',
    th:quiz.threshold|0,
    tm:normalizeTheme(quiz.theme),
    inv:quiz.inventory==null?null:quiz.inventory,
    b:(quiz.bands||[]).map(x=>({m:x.min,x:x.max,t:x.text})),
    q:(quiz.questions||[]).map(compactQuestion)
  };
  const raw=JSON.stringify(compact);
  const plain=toBase64Url(raw);
  const z=lzCompressB64Url(raw);
  if(z && (z.length+2) < plain.length) return 'z.'+z;
  return plain;
}
function normalizePayload(payload){
  let s=String(payload||'');
  // WeChat / messengers may inject whitespace or newlines
  s=s.replace(/[\s\u200b\ufeff]+/g,'');
  try{ s=decodeURIComponent(s); }catch(e){}
  s=s.replace(/[\s\u200b\ufeff]+/g,'');
  return s;
}
function decodeQuiz(payload){
  try{
    const s=normalizePayload(payload);
    if(!s) return null;
    let jsonStr=null;
    if(/^z\./i.test(s)){
      jsonStr=lzDecompressB64Url(s.slice(2));
      if(!jsonStr){
        // fallback: maybe plain after z. was truncated
        try{ jsonStr=fromBase64Url(s.slice(2)); }catch(e){}
      }
    } else {
      try{ jsonStr=fromBase64Url(s); }catch(e){}
      // if looks like compressed without being parsed as JSON, try LZ
      if(jsonStr){
        try{ JSON.parse(jsonStr); }catch(e){
          const ztry=lzDecompressB64Url(s);
          if(ztry) jsonStr=ztry;
        }
      } else {
        jsonStr=lzDecompressB64Url(s);
      }
    }
    if(!jsonStr) return null;
    const c=JSON.parse(jsonStr);
    if(!c||!Array.isArray(c.q)||c.q.length!==Q_COUNT)return null;
    const questions=c.q.map(expandQuestion);
    return {
      id:c.i||uid(),
      name:c.n||'',
      title:c.t||((c.n||'神秘人')+'的默契测试卷'),
      reward:c.r||'神秘奖励',
      threshold:typeof c.th==='number'?c.th:9,
      theme:normalizeTheme(c.tm),
      inventory:c.inv==null?null:c.inv,
      bands:(c.b||[]).map(x=>({min:x.m,max:x.x,text:x.t})),
      questions
    };
  }catch(e){return null}
}
function looksTruncatedPayload(payload){
  const s=normalizePayload(payload||'');
  if(!s) return false;
  if(s.length<40) return true;
  // typical base64 JSON starts with eyJ
  if(/^(eyJ|z\.)/i.test(s) && !decodeQuiz(s)) return true;
  return false;
}

function emptySlots(){
  return Array.from({length:Q_COUNT},()=>({q:'',options:['','',''],answer:0,filled:false}));
}
function defaultDraft(){
  return {
    id:uid(),
    name:'',
    nameSkipped:false,
    title:'',
    theme:'cute',
    slots:emptySlots(),
    step:0,
    reward:'奶茶券',
    rewardCustom:'',
    threshold:9,
    inventory:null,
    bands:DEFAULT_BANDS.map(b=>({...b}))
  };
}

  S.published=quiz;

}
function loadSavedNick(){
  try{ return localStorage.getItem(STORAGE_NICK)||''; }catch(e){ return ''; }
}
function savePlayerNick(nick){
  const n=String(nick||'').trim().slice(0,12);
  if(!n) return;
  try{ localStorage.setItem(STORAGE_NICK,n); }catch(e){}
  S.playNick=n;
}
function getPlayedRecord(qid){
  if(!qid) return null;
  try{
    const raw=localStorage.getItem(playedKey(qid));
    if(!raw) return null;
    const o=JSON.parse(raw);
    // Any mark for this quiz id (started or finished) counts as locked on this device
    return o&&(o.done||o.started)?o:null;
  }catch(e){ return null; }
}
function hasFinishedPlayed(qid){
  const o=getPlayedRecord(qid);
  return !!(o&&o.done);
}
function markQuizPlayed(qid, result){
  if(!qid) return;
  const rec={
    done:true,
    at:Date.now(),
    nick:S.playNick||loadSavedNick()||'',
    fp:getPlayerFp(),
    score:result&&result.score|0,
    pct:result&&result.pct|0,
    won:!!(result&&result.won),
    bandText:(result&&result.band&&result.band.text)||'',
    threshold:S.playQuiz?(S.playQuiz.threshold|0):0,
    reward:S.playQuiz?S.playQuiz.reward:'',
    title:S.playQuiz?S.playQuiz.title:''
  };
  try{ localStorage.setItem(playedKey(qid), JSON.stringify(rec)); }catch(e){}
}
function restoreResultFromPlayed(rec, quiz){
  if(!rec||!quiz) return null;
  const score=rec.score|0;
  const pct=typeof rec.pct==='number'?rec.pct:Math.round(score/Q_COUNT*100);
  const band=bandFor(score, quiz.bands);
  if(rec.bandText) band.text=rec.bandText;
  return {score,pct,band,won:!!rec.won, fromCache:true};
}
function goCreateOwn(){
  // Clear ?q= / ?s= so friend leaves this quiz and opens create

  if(!p.endsWith('/')){

    if(p.includes('.')) p=p.replace(/\/[^/]*$/,'/') || '/';
    else p=p+'/';
  }

}
function showLastPlayedResult(){

/* ---------- Payload extraction (q / s first!) ---------- */
function extractPayload(){
  const params=new URLSearchParams(location.search);
  let qPayload=params.get('q');
  const hash=location.hash||'';
  // #play/PAYLOAD or #play/PAYLOAD?...
  if(!qPayload){
    const hm=hash.match(/^#play\/([^?&#]+)/i);
    if(hm) qPayload=decodeURIComponent(hm[1]);
  }
  // #q=PAYLOAD
  if(!qPayload && /^#q=/i.test(hash)) qPayload=hash.slice(3);
  // hash query ?q=
  if(!qPayload){
    const m=hash.match(/[?&]q=([^&]+)/);
    if(m)qPayload=decodeURIComponent(m[1]);
  }
  return qPayload;
}
function extractShortId(){
  const params=new URLSearchParams(location.search);
  let sid=params.get('s');
  if(!sid){
    const hash=location.hash||'';
    const m=hash.match(/[?&]s=([^&]+)/i) || hash.match(/^#s=([^&]+)/i);
    if(m) sid=decodeURIComponent(m[1]);
  }
  if(!sid) return null;
  sid=String(sid).trim().replace(/[^a-zA-Z0-9_-]/g,'');
  return sid||null;
}
function hasFriendLink(){
  // Only URL intent — do not use S.playQuiz (previewAsFriend sets it without share params)
  return !!(extractPayload() || extractShortId());
}
function normalizeFetchedQuiz(data){
  if(!data||!Array.isArray(data.questions)||data.questions.length!==Q_COUNT) return null;
  return {
    id:data.id||uid(),
    name:data.name||'',
    title:data.title||((data.name||'神秘人')+'的默契测试卷'),
    reward:data.reward||'神秘奖励',
    threshold:typeof data.threshold==='number'?data.threshold:9,
    theme:normalizeTheme(data.theme||data.tm),
    inventory:data.inventory==null?null:data.inventory,
    bands:(data.bands||[]).map(x=>({min:x.min,max:x.max,text:x.text})),
    questions:data.questions.map(x=>{
      const q={q:x.q,options:x.options||x.o||[],answer:x.answer|0};
      if(typeof x.bankIdx==='number') q.bankIdx=x.bankIdx;
      else {
        const bi=findBankIdx({q:q.q,options:q.options});
        if(bi>=0) q.bankIdx=bi;
      }
      return q;
    })
  };
}
async function loadShortQuiz(id){
  const safe=String(id||'').replace(/[^a-zA-Z0-9_-]/g,'');
  if(!safe) return null;
  try{
    const res=await fetch('./s/'+safe+'.json',{cache:'no-store'});
    if(!res.ok) return null;
    return normalizeFetchedQuiz(await res.json());
  }catch(e){ return null; }
}

function pathBase(){
  // Prefer directory form .../zhiji/ for share links
  let p=location.pathname;
  if(p.endsWith('play.html')) p=p.replace(/play\.html$/,'');
  if(p.endsWith('index.html')) p=p.replace(/index\.html$/,'');
  if(!p.endsWith('/')) p=p.replace(/\/[^/]*$/,'/') || '/';
  return location.origin + p;
}

/* ---------- Routing: q / s ALWAYS forces play ---------- */
function parseRoute(){
  const params=new URLSearchParams(location.search);
  const qPayload=extractPayload();
  const sid=extractShortId();
  const hash=location.hash||'';
  const raw=(hash.replace(/^#/,'').split('?')[0]||'');
  const h=raw.toLowerCase().split('/')[0];

  // Manage ONLY when explicitly requested and not sharing as friend
  // If ?q= or ?s= present → NEVER create/home for friends
  if(qPayload || sid){
    if(params.get('manage')==='1' && h==='manage'){
      return 'manage';
    }
    if(qPayload){
      const quiz=decodeQuiz(qPayload);
      if(quiz){
        if(!S.playQuiz || S.playQuiz.id!==quiz.id){
          S.playQuiz=quiz;
          S.playIdx=0;S.playAnswers=[];S.result=null;
        } else {
          S.playQuiz=quiz;
        }
      }
    }
    // sid quiz is loaded async in boot; keep force-play once present
    if(h!=='play' && h!=='result'){
      try{ history.replaceState(null,'', location.pathname + location.search + '#play'); }catch(e){}
    }
    if(h==='result' && S.result) return 'result';
    if(h==='play' && S.playAnswers && S.playAnswers.length>0 && S.playIdx>0 && !S.result) return 'play';
    return 'play-intro';
  }

  if(params.get('dev')===DEV_TOKEN) return 'dev';
  if(params.get('manage')==='1') return 'manage';
  if(['home','create','reward','manage'].includes(h)) return h;
  if(h==='result' && S.result && S.playQuiz) return 'result';
  if(h==='play') return S.playQuiz ? (S.playAnswers.length>0 && S.playIdx>0 && !S.result ? 'play' : 'play-intro') : 'home';
  return 'home';
}

function navigate(route, replace){
  // Friend play with q: never navigate to create/home/reward
  if(hasFriendLink() && ['home','create','reward'].includes(route)){
    route='play-intro';
  }
  S.route=route;
  const map={home:'#home',create:'#create',reward:'#reward',manage:'#manage',dev:'#dev','play-intro':'#play',play:'#play',result:'#result'};
  let target=map[route]||'#home';
  // keep search when playing
  const q=extractPayload();
  const sid=extractShortId();
  if((q||sid) && (route==='play-intro'||route==='play'||route==='result')){
    const path=location.pathname;
    const search=location.search || (q?('?q='+encodeURIComponent(q)):('?s='+encodeURIComponent(sid)));
    const url=path+search+target;
    if(replace) history.replaceState(null,'',url);
    else if(location.hash!==target){ location.hash=target; }
    else render();
    if(location.hash===target || replace) render();
    return;
  }
  if(replace) history.replaceState(null,'', location.pathname + (route==='manage'?'?manage=1':'') + target);
  else if(location.hash!==target) location.hash=target;
  else render();
  if(location.hash===target) render();
}

function onHash(){
  const r=parseRoute();
  S.route=r;
  if(r==='create'||r==='reward'){ if(!S.draft) loadDraft(); ensureSlotSeeded(); }
  if(r==='manage') loadPublished();
  render();
}

/* ---------- Bank helpers (no duplicates across slots) ---------- */
function getUsedBankSet(exceptSlot){
  const used=new Set();
  if(!S.draft||!S.draft.slots) return used;
  S.draft.slots.forEach((s,i)=>{
    if(exceptSlot!=null && i===exceptSlot) return;
    if(s && typeof s.bankIdx==='number' && s.bankIdx>=0) used.add(s.bankIdx);
  });
  return used;
}
function pickRandomUnused(exceptSlot){
  const used=getUsedBankSet(exceptSlot!=null?exceptSlot:S.draft.step);
  const pool=BANK.map((_,i)=>i).filter(i=>!used.has(i));
  if(!pool.length){ toast('题库已用完，请自定义或从已选题中换掉'); return null; }
  return pool[Math.floor(Math.random()*pool.length)];
}
function applyBankToSlot(slotIdx, bankIdx, keepAnswer){
  const used=getUsedBankSet(slotIdx);
  if(used.has(bankIdx)){ toast('这道题已在其他题槽使用'); return false; }
  const b=BANK[bankIdx];
  const prev=S.draft.slots[slotIdx];
  const ans=(keepAnswer && prev && prev.answer!=null)?clamp(prev.answer|0,0,b.options.length-1):0;
  S.draft.slots[slotIdx]={q:b.q,options:[...b.options],answer:ans,filled:true,bankIdx};
  saveDraft();
  return true;
}
function ensureSlotSeeded(){
  if(!S.draft) return;
  const i=clamp(S.draft.step|0,0,Q_COUNT-1);
  const slot=S.draft.slots[i];
  if(!slot || slot.filled) return;
  const idx=pickRandomUnused(i);
  if(idx!=null) applyBankToSlot(i, idx);
}

/* ---------- Render ---------- */
function render(){
  const app=document.getElementById('app');
  let r=S.route;
  // Guard: never show create UI when friend payload present
  if(hasFriendLink() && (r==='home'||r==='create'||r==='reward'||r==='manage' && !(new URLSearchParams(location.search).get('manage')==='1'))){
    if(r!=='result' || !S.result) r=S.route=(S.result?'result':'play-intro');
  }
  if(r==='create' && S.draft && (S.draft.step|0)>=Q_COUNT) r='reward';
  if(r==='create') ensureSlotSeeded();
  if(r==='home') app.innerHTML=viewHome();
  else if(r==='create') app.innerHTML=viewCreate();
  else if(r==='reward') app.innerHTML=viewReward();
  else if(r==='dev'){ app.innerHTML=viewDev(); setTimeout(hydrateDevStats,0); }
  else if(r==='manage'){ app.innerHTML=viewManage(); setTimeout(paintManageQr,0); setTimeout(hydrateRemoteBoard,0); }
  else if(r==='play-intro'){ app.innerHTML=viewPlayIntro(); setTimeout(trackFriendOpen,0); }
  else if(r==='play') app.innerHTML=viewPlay();
  else if(r==='result'){ app.innerHTML=viewResult(); setTimeout(function(){ hydrateRemoteBoard(S.playQuiz&&S.playQuiz.id); },0); }
  else app.innerHTML=viewHome();
  syncThemeForRoute();
  window.scrollTo(0,0);
}

function nextStep(){

  if(!slot.filled || !slot.q.trim()){ toast('请先完成本题设置'); return; }

  if(i>=Q_COUNT-1){ S.draft.step=Q_COUNT; saveDraft(); navigate('reward'); return; }
  S.draft.step=i+1; saveDraft(); ensureSlotSeeded(); render();
}

  if(f) list=list.filter(x=>x.b.q.includes(f)||x.b.options.some(o=>o.includes(f)));
  const available=list.filter(x=>!used.has(x.i)||x.i===curBank);
  const tabs=['全部',...CATS].map(c=>{
    const n=c==='全部'?BANK.length:BANK.filter(b=>b.cat===c).length;

function removeOpt(j){
  if(S._edit.options.length<=2)return;
  S._edit.options.splice(j,1);
  if(S._edit.answer>=S._edit.options.length)S._edit.answer=S._edit.options.length-1;
  showEditorModal();
}
function saveEditor(){
  const q=String(S._edit.q||'').trim();
  const options=S._edit.options.map(o=>String(o||'').trim());
  if(!q){toast('请填写题目');return;}
  if(options.some(o=>!o)){toast('请填完所有选项');return;}
  if(options.length<2||options.length>6){toast('选项需 2–6 个');return;}
  const ans=clamp(S._edit.answer|0,0,options.length-1);
  // Custom questions do NOT keep bankIdx — frees previous bank id
  const slot={q,options,answer:ans,filled:true};
  if(!S._editIsNew && typeof S._edit.bankIdx==='number' && !S._editIsNew){
    // editing existing bank question text → treat as custom (no bank id) if user opened custom, else keep if same bank content edit
  }
  // Always clear bankIdx for custom/new; for "微调" keep bankIdx only if still same bank q? Spec: custom don't count as bank ids.
  // If user clicked 自定义 → clear. If 微调本题文案 from bank → clear bankIdx too so duplicates can reuse? Safer: editing text clears bankIdx.
  if(S._editIsNew){
    // custom — no bankIdx
  } else if(typeof S.draft.slots[S.draft.step].bankIdx==='number' && q===S.draft.slots[S.draft.step].q){
    slot.bankIdx=S.draft.slots[S.draft.step].bankIdx;
  }
  // if question text changed from bank, drop bankIdx
  S.draft.slots[S.draft.step]=slot;
  saveDraft();closeModal();toast('已保存');render();
}

async function hydrateRemoteBoard(quizId){
  const id=quizId || (S.published&&S.published.id) || (S.playQuiz&&S.playQuiz.id);
  if(!id) return;
  const box=document.getElementById('lb-remote-hook');
  if(!box) return;
  if(!LB_API.enabled){
    box.innerHTML='<p class="hint">跨设备排行榜未启用</p>';
    return;
  }
  // Prefer board returned by the just-finished POST (avoids WeChat/*.workers.dev flaky GET)
  if(S.lastRemoteBoard && S.lastRemoteBoard.quizId===id && Array.isArray(S.lastRemoteBoard.board) && S.lastRemoteBoard.board.length){
    box.innerHTML=renderBoardRows(S.lastRemoteBoard.board);
    return;
  }
  box.innerHTML='<p class="hint">正在加载排行榜…</p>';
  const board=await fetchBoardRemote(id);
  if(board===null){
    const self=selfBoardFallback();
    if(self){
      box.innerHTML='<p class="hint">排行榜加载失败，可能是网络拦截（如微信内置浏览器拦 *.workers.dev）。以下先显示你自己的成绩：</p>'+renderBoardRows(self);
    } else {
      box.innerHTML='<p class="hint">排行榜加载失败，可能是网络拦截（如微信内置浏览器拦 *.workers.dev）。请用系统浏览器打开再试，或稍后再看。</p>';
    }
    return;
  }
  if(!board.length){
    const self=selfBoardFallback();
    if(self){
      // Just finished but remote still empty / lag — never look blank for the finisher
      box.innerHTML=renderBoardRows(self)+'<p class="hint">成绩已提交；若其他人还没出现，稍后再刷新。</p>';
    } else {
      box.innerHTML='<p class="hint">还没有人答完；好友答完后会出现在这里</p>';
    }
    return;
  }
  box.innerHTML=renderBoardRows(board);
}

function paintManageQr(){
  const el=document.getElementById('share-qr');
  const meta=document.getElementById('share-qr-meta');
  if(!el || !S.published) return;
  if(typeof qrcode!=='function'){
    el.innerHTML='<p class="hint">二维码组件未加载，请改用复制链接</p>';
    return;
  }
  const url=pickQrUrl(S.published);
  try{
    const q=qrcode(0,'L');
    q.addData(url,'Byte');
    q.make();
    const n=q.getModuleCount();
    const cell=Math.max(3, Math.floor(280/n));
    const margin=2;
    const size=(n+margin*2)*cell;
    const canvas=document.createElement('canvas');
    canvas.width=size; canvas.height=size;
    const ctx=canvas.getContext('2d');
    ctx.fillStyle='#ffffff';
    ctx.fillRect(0,0,size,size);
    ctx.fillStyle='#111111';
    for(let r=0;r<n;r++){
      for(let c=0;c<n;c++){
        if(q.isDark(r,c)) ctx.fillRect((c+margin)*cell,(r+margin)*cell,cell,cell);
      }
    }
    const dataUrl=canvas.toDataURL('image/png');
    S._qrDataUrl=dataUrl;
    S._qrUrl=url;
    const img=document.createElement('img');
    img.src=dataUrl;
    img.alt='默契测试邀请二维码';
    img.width=size;
    img.height=size;
    el.innerHTML='';
    el.appendChild(img);
    if(meta){
      const kind=url.indexOf('?s=')>=0?'短链 ?s=':'压缩 ?q=';
      meta.textContent=kind+' · 约 '+url.length+' 字符 · 模块 '+n+'（可长按保存）';
    }
  }catch(e){
    console&&console.warn&&console.warn(e);
    el.innerHTML='<p class="hint">二维码生成失败（链接可能过长），请复制压缩邀请链接或短链。</p>';
    S._qrDataUrl='';
  }
}
function drawQrToCanvas(url, pixelSize){
  if(typeof qrcode!=='function') throw new Error('no qrcode');
  const q=qrcode(0,'L');
  q.addData(url,'Byte');
  q.make();
  const n=q.getModuleCount();
  const margin=2;
  const cell=Math.max(2, Math.floor(pixelSize/(n+margin*2)));
  const size=(n+margin*2)*cell;
  const canvas=document.createElement('canvas');
  canvas.width=size; canvas.height=size;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#ffffff';
  ctx.fillRect(0,0,size,size);
  ctx.fillStyle='#111111';
  for(let r=0;r<n;r++){
    for(let c=0;c<n;c++){
      if(q.isDark(r,c)) ctx.fillRect((c+margin)*cell,(r+margin)*cell,cell,cell);
    }
  }
  return canvas;
}
function roundRectPath(ctx,x,y,w,h,r){
  const rr=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+rr,y);
  ctx.arcTo(x+w,y,x+w,y+h,rr);
  ctx.arcTo(x+w,y+h,x,y+h,rr);
  ctx.arcTo(x,y+h,x,y,rr);
  ctx.arcTo(x,y,x+w,y,rr);
  ctx.closePath();
}

  if(name && name!=='神秘人') return ['关于'+name+'的'+qn+'道题','你能答对多少？'];
  return ['关于我的'+qn+'道题','你能答对多少？'];

function buildSharePoster(quiz){
  const SIZE=1080;
  const dpr=Math.min(Math.max(window.devicePixelRatio||1, 1), 3);
  const canvas=document.createElement('canvas');
  canvas.width=Math.round(SIZE*dpr);
  canvas.height=Math.round(SIZE*dpr);
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);

  // soft blue Moments bg
  ctx.fillStyle='#D6E4FF';
  ctx.fillRect(0,0,SIZE,SIZE);

  const cardX=78, cardY=150, cardW=SIZE-156, cardH=820;
  const cardR=28;
  // ticket card shadow
  ctx.save();
  ctx.shadowColor='rgba(74,122,199,.22)';
  ctx.shadowBlur=28;
  ctx.shadowOffsetY=10;
  ctx.fillStyle='#ffffff';
  roundRectPath(ctx,cardX,cardY,cardW,cardH,cardR);
  ctx.fill();
  ctx.restore();

  // side ticket notches (paint bg blue over card edge)
  const notchY=cardY+cardH*0.62;
  const notchR=22;
  ctx.fillStyle='#D6E4FF';
  ctx.beginPath(); ctx.arc(cardX, notchY, notchR, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cardX+cardW, notchY, notchR, 0, Math.PI*2); ctx.fill();

  // dashed divider at notch level
  ctx.strokeStyle='#E5ECF7';
  ctx.lineWidth=3;
  ctx.setLineDash([10,10]);
  ctx.beginPath();
  ctx.moveTo(cardX+36, notchY);
  ctx.lineTo(cardX+cardW-36, notchY);
  ctx.stroke();
  ctx.setLineDash([]);

  // avatar circle (placeholder: initial / gift)
  const ax=SIZE/2, ay=cardY, ar=78;
  ctx.save();
  ctx.beginPath(); ctx.arc(ax,ay,ar+6,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
  ctx.beginPath(); ctx.arc(ax,ay,ar,0,Math.PI*2);
  const grad=ctx.createLinearGradient(ax-ar,ay-ar,ax+ar,ay+ar);
  grad.addColorStop(0,'#B7D4FF');
  grad.addColorStop(1,'#7BC9A6');
  ctx.fillStyle=grad;
  ctx.fill();
  ctx.lineWidth=6; ctx.strokeStyle='#fff'; ctx.stroke();
  const initial=((quiz.name||'').trim().charAt(0)) || '🎁';
  ctx.fillStyle='#2F5FA8';
  ctx.font='700 54px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText(initial, ax, ay+2);
  ctx.restore();

  // optional name under avatar
  const showName=(quiz.name||'').trim();
  if(showName){
    ctx.fillStyle='#6B7C93';
    ctx.font='600 28px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
    ctx.textAlign='center';
    ctx.textBaseline='alphabetic';
    ctx.fillText(showName.length>10?showName.slice(0,10)+'…':showName, ax, ay+ar+42);
  }

  // big blue title
  const titles=posterTitleLines(quiz);
  ctx.fillStyle='#4A7AC7';
  ctx.font='700 64px "Songti SC","STSong","Noto Serif SC","PingFang SC",serif';
  ctx.textAlign='center';
  let titleY=ay+ar+(showName?88:56);
  titles.forEach((line,i)=>{
    ctx.fillText(line, ax, titleY+i*78);
  });

  // prize row
  const prizeY=titleY+titles.length*78+36;
  ctx.font='700 36px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
  ctx.fillStyle='#C9A227';
  ctx.textAlign='left';
  const label='奖品:';
  const reward=String(quiz.reward||'神秘奖励');
  ctx.font='600 34px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
  const chipPadX=22, chipH=64;
  ctx.font='700 32px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
  const chipText='🧋  '+(reward.length>10?reward.slice(0,10)+'…':reward);
  const chipW=Math.min(cardW-200, Math.max(200, ctx.measureText(chipText).width+chipPadX*2));
  ctx.font='700 36px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
  const labelW=ctx.measureText(label).width;
  const rowW=labelW+18+chipW;
  const rowX=ax-rowW/2;
  ctx.fillStyle='#C9A227';
  ctx.fillText(label, rowX, prizeY+44);
  const chipX=rowX+labelW+18;
  ctx.fillStyle='#F9D460';
  roundRectPath(ctx,chipX,prizeY,chipW,chipH,16);
  ctx.fill();
  ctx.fillStyle='#8A5A10';
  ctx.font='700 32px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText(chipText, chipX+chipW/2, prizeY+chipH/2+1);
  ctx.textBaseline='alphabetic';

  // bottom left copy
  const leftX=cardX+48;
  const bottomY=notchY+70;
  ctx.textAlign='left';
  ctx.fillStyle='#333333';
  ctx.font='700 36px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
  ctx.fillText('你真的懂我吗?', leftX, bottomY);
  ctx.fillStyle='#999999';
  ctx.font='500 26px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
  ctx.fillText('长按识别二维码答题', leftX, bottomY+44);

  // QR bottom right — same invite URL as manage QR
  const url=pickQrUrl(quiz) || shareUrl(quiz);
  const qrBox=250;
  const qrCanvas=drawQrToCanvas(url, qrBox);
  const qrX=cardX+cardW-48-qrBox;
  const qrY=notchY+36;
  ctx.fillStyle='#fff';
  roundRectPath(ctx,qrX-10,qrY-10,qrBox+20,qrBox+20,12);
  ctx.fill();
  ctx.drawImage(qrCanvas, qrX, qrY, qrBox, qrBox);

  return {canvas, dataUrl:canvas.toDataURL('image/png'), url};
}

function bandFor(score,bands){
  const list=bands&&bands.length?bands:DEFAULT_BANDS;
  let best=list[0];
  for(const b of list){
    if(score>=b.min && score<=b.max) best=b;
  }
  if(!(score>=best.min&&score<=best.max)){
    const sorted=[...list].sort((a,b)=>a.min-b.min);
    best=sorted[0];
    for(const b of sorted){ if(score>=b.min) best=b; }
  }
  return best;
}
async function finishPlay(){
  const quiz=S.playQuiz;
  let score=0;
  for(let i=0;i<Q_COUNT;i++) if(S.playAnswers[i]===quiz.questions[i].answer) score++;
  const pct=Math.round(score/Q_COUNT*100);
  const band=bandFor(score, quiz.bands);
  const won=score>=(quiz.threshold|0);
  S.result={score,pct,band,won};
  if(S.playNick) savePlayerNick(S.playNick);
  const st=getStats(quiz.id);
  st.plays=(st.plays|0)+1;
  if(won) st.wins=(st.wins|0)+1;
  st.board=st.board||[];
  st.board.push({nick:S.playNick||'匿名',score,pct,at:Date.now(),won});
  st.board.sort((a,b)=>b.score-a.score||b.at-a.at);
  st.board=st.board.slice(0,50);
  setStats(quiz.id,st);
  const remote=await submitScoreRemote(quiz.id, {nick:S.playNick||'匿名', score, pct, won, at:Date.now()});
  if(remote && Array.isArray(remote.board)){
    S.lastRemoteBoard={quizId:quiz.id, board:remote.board};

    if(!(S.lastRemoteBoard && S.lastRemoteBoard.quizId===quiz.id)) S.lastRemoteBoard=null;

  // Mark this quiz id as played (friend share only; preview may retry)
  if(hasFriendLink()) markQuizPlayed(quiz.id, S.result);
  S._activePlay=false;
  S.route='result';
  const search=location.search||'';
  history.replaceState(null,'', location.pathname+search+'#result');
  render();
}

(function initBgm(){
  const MUTE_KEY = 'zhiji_bgm_muted';
  const audio = document.getElementById('bgm');
  const btn = document.getElementById('bgm-toggle');
  if(!audio || !btn) return;

  audio.volume = 0.2;
  let unlocked = false;
  let muted = false;
  let gestureBound = false;
  try { muted = localStorage.getItem(MUTE_KEY) === '1'; } catch(e) {}

  function syncUi(){
    btn.textContent = muted ? '🔇' : '🔊';
    btn.setAttribute('aria-pressed', muted ? 'true' : 'false');
    btn.title = muted ? '点击开启背景音乐' : '点击静音背景音乐';
  }

  function persist(){
    try { localStorage.setItem(MUTE_KEY, muted ? '1' : '0'); } catch(e) {}
  }

  function tryPlay(){
    if(muted) return Promise.resolve(false);
    const p = audio.play();
    if(p && typeof p.then === 'function'){
      return p.then(function(){
        unlocked = true;
        return true;
      }).catch(function(){
        return false;
      });
    }
    unlocked = true;
    return Promise.resolve(true);
  }

  }

      if(ok) unbindGesture();

  }

  function unbindGesture(){
    if(!gestureBound) return;

    document.removeEventListener('pointerdown', onFirstGesture, true);
    document.removeEventListener('touchstart', onFirstGesture, true);
    document.removeEventListener('click', onFirstGesture, true);
  }

  function bindGesture(){
    if(gestureBound || muted) return;
    gestureBound = true;
    document.addEventListener('pointerdown', onFirstGesture, {capture:true, passive:true});
    document.addEventListener('touchstart', onFirstGesture, {capture:true, passive:true});
    document.addEventListener('click', onFirstGesture, {capture:true});
  }

  function wechatPlay(){

  function bindWeChat(){

      wechatPlay();

  }

  btn.addEventListener('click', function(ev){
    ev.stopPropagation();
    muted = !muted;
    persist();
    syncUi();
    if(muted){
      audio.pause();
      unbindGesture();
    } else {
      unlockAndPlay().then(function(ok){
        if(!ok) bindGesture();
        else unbindGesture();
      });
    }
  });

  document.addEventListener('visibilitychange', function(){
    if(document.hidden){
      audio.pause();
    } else if(!muted){
      tryPlay().then(function(ok){
        if(ok) unlocked = true;
      });
    }
  });

  window.addEventListener('pageshow', function(){
    if(!muted) tryPlay();
  });

  ['loadeddata','canplay','canplaythrough'].forEach(function(evName){
    audio.addEventListener(evName, function(){
      if(!muted && audio.paused) tryPlay();
    });
  });

  syncUi();
  bindWeChat();
  if(muted){
    audio.pause();
  } else {
    tryPlay().then(function(ok){
      if(!ok || audio.paused) bindGesture();
      else unbindGesture();
    });
    // Aggressive immediate + short delayed retries for mobile entry
    setTimeout(function(){ if(!muted && audio.paused) tryPlay(); }, 0);
    setTimeout(function(){ if(!muted && audio.paused) tryPlay(); }, 300);
    setTimeout(function(){ if(!muted && audio.paused) tryPlay(); }, 800);
  }
})();

  if(isDevMode()){
    try{ history.replaceState(null,'', location.pathname + '?dev=' + encodeURIComponent(DEV_TOKEN) + '#dev'); }catch(e){}
    S.route='dev';
  }
  window.addEventListener('hashchange', onHash);
  Object.assign(window,{
    S,clamp,navigate,startCreate,goManage,setSlotAnswer,prevStep,nextStep,
    randomBankSlot,openBankPicker,refreshBankModal,chooseBank,closeModal,
    customSlot,editCurrentSlot,addOpt,removeOpt,saveEditor,pickReward,pickRewardCustom,
    onRewardInput,updBand,addBand,rmBand,publishQuiz,showQuestions,copyLink,copyShortLink,exportQuizJson,copyHashLink,saveQrImage,savePosterImage,generateSharePoster,buildSharePoster,switchQrMode,paintManageQr,
    previewAsFriend,beginPlay,pickPlay,skipName,pickThreshold,pickInventory,clearManageAndHome,goCreateOwn,showLastPlayedResult,savePlayerNick,
    applyTheme,setDraftTheme,applyTemplate,normalizeTheme,TEMPLATES,THEME_META,LB_API,DEV_TOKEN,submitScoreRemote,fetchBoardRemote,hydrateRemoteBoard,postHitRemote,postMsgRemote,fetchMsgRemote,fetchSiteStatsRemote,openMsgInbox,openLeaveMsg,submitLeaveMsg,hydrateDevStats,renderDevSite,viewDev,trackFriendOpen
  });
  if(qPayload || sid){
    try{ history.replaceState(null,'', location.pathname + location.search + '#play'); }catch(e){}
    S.route='play-intro';
    if(qPayload){
      const quiz=decodeQuiz(qPayload);
      if(quiz){
        S.playQuiz=quiz;
        applyTheme(quiz.theme);
        S.playIdx=0;S.playAnswers=[];S.result=null;
      }
    }
    if(!S.playQuiz && sid){
      S._shortLoading=true;
      render();
      const quiz=await loadShortQuiz(sid);
      S._shortLoading=false;
      if(quiz){
        S.playQuiz=quiz;
        applyTheme(quiz.theme);
        S.playIdx=0;S.playAnswers=[];S.result=null;
        S._shortLoadFailed=false;
      } else {
        S._shortLoadFailed=true;
      }
    }
    // Restore finished result for this quiz id after refresh
    if(S.playQuiz){
      const rec=getPlayedRecord(S.playQuiz.id);
      if(rec&&rec.done){
        S.result=restoreResultFromPlayed(rec, S.playQuiz);
        const h=(location.hash||'').replace(/^#/,'').split('?')[0].toLowerCase();
        if(h==='result') S.route='result';
        else S.route='play-intro'; // intro shows already-played UI
      }
    }
  } else {
    loadDraft();
    loadPublished();
    S.route=parseRoute();
  }
  if((S.route==='create'||S.route==='reward')&&!S.draft) loadDraft();
  if(S.route==='create') ensureSlotSeeded();
  if(S.draft) applyTheme(S.draft.theme);
  else if(S.playQuiz) applyTheme(S.playQuiz.theme);
  else applyTheme('cute');
  render();
})();
</script>
</body>
</html>
