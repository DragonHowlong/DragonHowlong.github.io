<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>默契测试 · 进入答题</title>
<script>
(function () {
  // Thin redirect: keep ?q= / ?s= / hash payload, land on index play flow
  var q = location.search || '';
  var h = location.hash || '';
  // If only hash #play/PAYLOAD or #q=, keep it; else ensure #play when q or s present
  if (/[?&](q|s)=/.test(q) && !h) h = '#play';
  if (!q && !h) {
    // no payload — go home create entry
    location.replace('./#home');
    return;
  }
  location.replace('./' + q + h);
})();
</script>
</head>
<body style="font-family:sans-serif;text-align:center;padding:40px;color:#3A8FB0;background:#EAF6F3">
  <p>正在进入答题页…</p>
</body>
</html>
