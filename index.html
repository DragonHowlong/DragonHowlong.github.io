<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>滅海襲 · Dragon·W·howlong</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;background:#f6f5f2;color:#222;line-height:1.7;min-height:100vh;display:flex;justify-content:center;padding:40px 20px 56px}
main{max-width:640px;width:100%}
.topnav{display:flex;justify-content:flex-end;gap:18px;margin-bottom:24px;font-size:14px}
.topnav a{color:#666;text-decoration:none;letter-spacing:1px;min-height:44px;display:inline-flex;align-items:center}
.topnav a:hover{color:#222}
header{text-align:center;margin-bottom:36px}
.avatar{width:96px;height:96px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 18px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
h1{font-size:32px;letter-spacing:4px;font-weight:700}
.en{color:#777;font-size:15px;letter-spacing:1px;margin-top:4px}
h2{font-size:16px;color:#555;font-weight:600;letter-spacing:2px;margin:0 0 16px;text-align:center}
.section{margin-bottom:36px}
.play-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.slot{border-radius:16px;padding:22px 18px;text-decoration:none;color:inherit;display:flex;flex-direction:column;align-items:center;text-align:center;min-height:188px;justify-content:center;transition:transform .2s,box-shadow .2s;background:#fff;border:1px solid #e4e0d8;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.slot:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.08)}
.slot .thumb,.slot .icon-box{width:72px;height:72px;border-radius:16px;margin-bottom:12px;display:flex;align-items:center;justify-content:center}
.slot .thumb{object-fit:cover;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.slot .icon-box{background:#f3f1ec;font-size:28px}
.slot h3{font-size:20px;letter-spacing:2px;color:#222;margin-bottom:6px;font-weight:650}
.slot .sub{font-size:13px;color:#888;letter-spacing:.5px;margin-bottom:14px;min-height:1.2em}
.slot .cta{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 22px;border-radius:999px;font-size:14px;font-weight:600;letter-spacing:1px;width:100%;max-width:220px}
.slot-live{border-color:#b9dce8;background:linear-gradient(145deg,#e8f6fb 0%,#d9f0e8 55%,#eef8f4 100%)}
.slot-live .cta{background:#4BA3C7;color:#fff}
.slot-more .cta{background:#eceae4;color:#444}
.about-entry{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid #e4e0d8;border-radius:16px;padding:22px 20px;box-shadow:0 1px 3px rgba(0,0,0,.05);transition:transform .2s,box-shadow .2s}
.about-entry:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.08)}
.about-entry p{color:#666;font-size:14px;margin-top:6px}
.about-entry .go{display:inline-flex;margin-top:14px;min-height:44px;align-items:center;color:#2a6f8f;font-weight:600;letter-spacing:1px}
footer{text-align:center;color:#aaa;font-size:13px;margin-top:28px}
footer a{color:#999;text-decoration:none}
footer a:hover{color:#666}
</style>
</head>
<body>
<main>
<nav class="topnav" aria-label="站点导航">
  <a href="https://dragonhowlong.github.io/zhiji/">测试题</a>
  <a href="about.html">关于我</a>
</nav>
<header>
  <img class="avatar" src="avatar.jpg" alt="滅海襲">
  <h1>滅海襲</h1>
  <div class="en">Dragon·W·howlong</div>
</header>
<section class="section" id="play">
  <h2>要不玩些什么？</h2>
  <div class="play-grid">
    <a class="slot slot-live" href="https://dragonhowlong.github.io/zhiji/">
      <img class="thumb" src="memes/m08.jpg" alt="测试题" onerror="this.style.display='none'">
      <h3>测试题</h3>
      <div class="sub">默契小游戏</div>
      <span class="cta">立即开玩</span>
    </a>
    <a class="slot slot-more" href="more.html">
      <div class="icon-box" aria-hidden="true">🔒</div>
      <h3>更多</h3>
      <div class="sub">准备中</div>
      <span class="cta">看看再说</span>
    </a>
  </div>
</section>
<section class="section" id="about">
  <h2>关于我</h2>
  <a class="about-entry" href="about.html">
    <strong style="font-size:18px;letter-spacing:1px">认识一下</strong>
    <p>爱好、个人信息与联系方式</p>
    <span class="go">进入关于我 →</span>
  </a>
</section>
<footer>
  <a href="about.html">关于我</a>
  <div style="margin-top:10px">© 2026 滅海襲</div>
</footer>
</main>
</body>
</html>
