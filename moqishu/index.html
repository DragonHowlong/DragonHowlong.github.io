                <circle cy="16" r="2.6" fill="#c98410"/>
                <path d="M0 13 L0 16" stroke="#c98410" stroke-width="1.4"/>
              </g>
              <g transform="translate(52 318)">
                <path d="M-7 1 C-7 -9 7 -9 7 1 C7 7 3 10 0 10 C-3 10 -7 7 -7 1 Z" fill="#ff8ab0" stroke="#c98410" stroke-width="1.4" stroke-linejoin="round"/>
                <rect x="-2" y="-12" width="4" height="4" rx="1" fill="#c98410"/>
                <circle cy="13" r="2.1" fill="#c98410"/>
              </g>
            </g>

            <!-- string lights -->
            <g id="lights" filter="url(#softGlow)"></g>

            <!-- 10 hooks, bottom to top -->
            <g id="hooks" fill="none" stroke-linecap="round">
              <path class="hook" data-tier="1" d="M100 386 a7 7 0 0 0 14 0" />
              <path class="hook" data-tier="2" d="M186 358 a7 7 0 0 0 14 0" />
              <path class="hook" data-tier="3" d="M106 324 a7 7 0 0 0 14 0" />
              <path class="hook" data-tier="4" d="M180 292 a7 7 0 0 0 14 0" />
              <path class="hook" data-tier="5" d="M112 260 a7 7 0 0 0 14 0" />
              <path class="hook" data-tier="6" d="M174 228 a7 7 0 0 0 14 0" />
              <path class="hook" data-tier="7" d="M120 196 a7 7 0 0 0 14 0" />
              <path class="hook" data-tier="8" d="M166 164 a7 7 0 0 0 14 0" />
              <path class="hook" data-tier="9" d="M128 132 a7 7 0 0 0 14 0" />
              <path class="hook" data-tier="10" d="M143 96 a7 7 0 0 0 14 0" />
            </g>

            <!-- paper star -->
            <g class="top-star" filter="url(#starGlow)" transform="translate(150 64)">
              <path d="M0 -22 L6.2 -7 L22 -7 L9.5 3 L14 18 L0 10 L-14 18 L-9.5 3 L-22 -7 L-6.2 -7 Z" fill="#ffd24a" stroke="#c98410" stroke-width="2.2" stroke-linejoin="round" />
              <circle cy="-2" r="3.6" fill="#fff6c8" />
            </g>

            <!-- gift box (0–4 ending home), same place -->
            <g class="gift-box" transform="translate(214 428)">
              <rect width="52" height="38" rx="6" fill="url(#boxGrad)" stroke="#8a2020" stroke-width="2" />
              <rect x="22" width="8" height="38" fill="#ffd24a" />
              <rect y="14" width="52" height="8" fill="#ffd24a" />
              <path d="M18 10 C18 -4 30 -4 26 4 C34 -2 38 10 32 10 Z" fill="#ffd24a" stroke="#c98410" stroke-width="1.2" />
              <path d="M32 10 C32 -2 44 0 38 6 C46 4 46 12 40 12 Z" fill="#ffd24a" stroke="#c98410" stroke-width="1.2" />
              <rect x="-2" y="-5" width="56" height="10" rx="4" fill="#ff6b6b" stroke="#8a2020" stroke-width="2" />
            </g>
            <g class="gift-box gift-box-2" transform="translate(36 448)">
              <rect width="40" height="30" rx="5" fill="url(#boxGradTeal)" stroke="#1a6a58" stroke-width="2" />
              <rect x="16" width="7" height="30" fill="#ffd24a" />
              <rect y="11" width="40" height="7" fill="#ffd24a" />
              <path d="M14 8 C14 -3 24 -3 20 4 C27 -1 31 8 25 8 Z" fill="#ffd24a" stroke="#c98410" stroke-width="1" />
              <rect x="-2" y="-4" width="44" height="8" rx="3" fill="#2a9d7c" stroke="#1a6a58" stroke-width="2" />
            </g>
            <g class="gift-box gift-box-3" transform="translate(86 468)">
              <rect width="28" height="22" rx="4" fill="url(#boxGradGold)" stroke="#8a5a10" stroke-width="1.8" />
              <rect x="11" width="6" height="22" fill="#e24b4b" />
              <rect y="8" width="28" height="6" fill="#e24b4b" />
            </g>
          </svg>

          <div class="ornament" id="ornament" data-tier="0">
            <div class="ornament-hanger"></div>
            <div class="ornament-cap"></div>
            <div class="ornament-body">
              <span class="ornament-shine"></span>
              <span class="ornament-name" id="ornament-name"></span>
            </div>
          </div>

          <div class="deco-layer" id="deco-layer" aria-hidden="true"></div>
          </div>
        </div>
        <div class="floor" aria-hidden="true"></div>
        <div class="rug" aria-hidden="true"></div>
        <div class="spotlight" aria-hidden="true"></div>
        <div class="vignette" aria-hidden="true"></div>
      </div>

      <!-- INVITE -->
      <section class="scene" id="scene-invite" data-scene="invite" hidden>
        <div class="letter sheet" id="invite-letter">
          <p class="letter-kicker">一封邀请</p>
          <h2 class="letter-title">
            <span id="invite-host"></span>
            <span class="letter-title-rest">请你来认一认这棵树</span>
          </h2>
          <p class="letter-mood" id="invite-mood"></p>
          <p class="letter-rule">答对一题，就往树上爬一层</p>
          <p class="social-proof" id="social-proof" hidden></p>
          <div class="ornament-preview-wrap">
            <div class="ornament is-preview" id="preview-ornament">
              <div class="ornament-hanger"></div>
              <div class="ornament-cap"></div>
              <div class="ornament-body">
                <span class="ornament-shine"></span>
                <span class="ornament-name" id="preview-name">你的名字</span>
              </div>
            </div>
          </div>
          <label class="name-field">
            <span class="name-label">你的名字，会写在挂件上</span>
            <input id="player-name" type="text" maxlength="15" autocomplete="nickname" placeholder="怎么称呼你" />
          </label>
          <button type="button" class="btn-primary" id="btn-start">走起</button>
          <p class="fine-print">默契测试的仿写练习 · 不是 Cloudz 或 Helopal 的游戏</p>
        </div>
      </section>

      <!-- INTRO -->
      <section class="scene scene-overlay" id="scene-intro" data-scene="intro" hidden>
        <p class="intro-caption" id="intro-caption"></p>
        <button type="button" class="btn-text btn-skip" id="btn-skip-intro">跳过</button>
      </section>

      <!-- QUIZ -->
      <section class="scene scene-bottom" id="scene-quiz" data-scene="quiz" hidden>
        <div class="board sheet" id="quiz-board">
          <p class="flavor" id="flavor" hidden></p>
          <p class="board-kicker ribbon" id="quiz-kicker">第 1 题</p>
          <h2 class="board-question" id="quiz-question"></h2>
          <div class="choices" id="quiz-choices"></div>
        </div>
      </section>

      <!-- RESULT -->
      <section class="scene scene-bottom" id="scene-result" data-scene="result" hidden>
        <div class="result-card sheet" id="result-card">
          <p class="result-kicker ribbon" id="result-kicker"></p>
          <h2 class="result-title" id="result-title"></h2>
          <p class="result-score">
            <span id="result-player"></span>对<span id="result-host"></span>的了解
            <strong id="result-score"></strong>/10
          </p>
          <p class="result-body" id="result-body"></p>
          <p class="result-comeback" id="result-comeback"></p>
          <button type="button" class="btn-primary" id="btn-create">也出一套我的题</button>
          <div class="result-links">
            <button type="button" class="btn-text" id="btn-peek-tree">再看一眼树</button>
            <button type="button" class="btn-text" id="btn-retry">再答一次</button>
          </div>
        </div>
      </section>

      <!-- CREATE NAME -->
      <section class="scene" id="scene-create-name" data-scene="create-name" hidden>
        <div class="letter sheet">
          <p class="letter-kicker">轮到你了</p>
          <h2 class="letter-title">先在挂件上写下你的名字</h2>
          <p class="letter-rule">接下来用 10 道关于你的题，把树点亮</p>
          <label class="name-field">
            <span class="name-label">出题人的名字</span>
            <input id="creator-name" type="text" maxlength="15" autocomplete="nickname" placeholder="怎么称呼你" />
          </label>
          <div class="ornament-preview-wrap">
            <div class="ornament is-preview is-gold" id="creator-ornament">
              <div class="ornament-hanger"></div>
              <div class="ornament-cap"></div>
              <div class="ornament-body">
                <span class="ornament-shine"></span>
                <span class="ornament-name" id="creator-preview-name">你的名字</span>
              </div>
            </div>
          </div>
          <button type="button" class="btn-primary" id="btn-create-start">开始出题</button>
        </div>
      </section>

      <!-- CREATE QUIZ -->
      <section class="scene scene-bottom" id="scene-create-quiz" data-scene="create-quiz" hidden>
        <div class="board sheet">
          <p class="board-kicker ribbon" id="create-kicker">装饰第 1 层</p>
          <h2 class="board-question" id="create-question"></h2>
          <p class="board-hint">点你的答案，这层就会亮起来</p>
          <div class="choices" id="create-choices"></div>
        </div>
      </section>

      <!-- SHARE -->
      <section class="scene scene-bottom" id="scene-share" data-scene="share" hidden>
        <div class="result-card share-card sheet">
          <p class="result-kicker ribbon">你的树已经点亮</p>
          <h2 class="result-title">发给朋友，看他们挂在哪一层</h2>
          <p class="share-host" id="share-host-line"></p>
          <div class="share-link-row">
            <code class="share-link" id="share-link"></code>
            <button type="button" class="btn-copy" id="btn-copy">复制</button>
          </div>
          <button type="button" class="btn-primary" id="btn-open-invite">打开邀请页试试</button>
          <p class="fine-print tight">演示短链，卷面存在这台设备的浏览器里，没有真实后台</p>
        </div>
      </section>

    </div>
  </div>

  <audio id="bgm" loop preload="auto" autoplay playsinline webkit-playsinline>
    <source src="audio/quirky-little-march.m4a" type="audio/mp4">
    <source src="audio/quirky-little-march.mp3" type="audio/mpeg">
  </audio>
  <button type="button" id="bgm-toggle" class="bgm-toggle" aria-label="切换背景音乐静音" aria-pressed="false" title="背景音乐">🔊</button>

  <script src="app.js"></script>
</body>
</html>
